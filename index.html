 function ceremony(route,from){
  var p=S.p,c=car(),pa=PATHS[p.path],ps=C.post(),b=bossOf(),r=p.rank;
  var o=[];
  o.push(pick(CER[grp()]));
  if(route==='letter'&&from)o.push('你呈上'+(from.id?nm(from.id):'舊日')+'的舉薦信，眾人聽罷，神色各異，最終無人反對。');
  else if(route==='war')o.push('你累積的赫赫大功擺在眼前，無人再說「資歷尚淺」。');
  else if(route==='bribe')o.push('任命三日後便下來了。有人說「做事嘛，得懂規矩」，也有人在背後側目。');
  else if(b)o.push(nm(b)+'當眾宣讀：「'+p.name+'勤勉可嘉，擢為'+pa.ranks[r]+'。」');
  else o.push('你憑自己的本事，掙得了這個位子。');
  o.push('\n新任：'+p.title+'\n職司：'+ps.duty+'\n每月加給：俸祿+'+ps.sal+'金'+(ps.troop?'，部曲+'+ps.troop:'')+(r>=3?'，另有食邑田莊之入':''));
  return o.join('\n');
 }
 function doPromote(route,lt){
  var p=S.p,c=car(),b=bossOf();
  c.via=ROUTE_N[route];
  p.rank=Math.min(4,p.rank+1);p.title=titleOf();sync();
  if(route==='letter'){c.nL++;}
  if(route==='bribe'){c.nB++;}
  var ps=C.post();
  var fx={days:5,st:{rep:route==='bribe'?-2:3,gold:route==='bribe'?0:30*p.rank+(p.rank>=3?60:0)}};
  if(ps.troop>=2)fx.st.troop=ps.troop*2;
  if(b&&route!=='bribe'){fx.rel={};fx.rel[b]={tr:3,re:3};}
  if(lt&&lt.id&&alive(lt.id)){fx.rel=fx.rel||{};fx.rel[lt.id]={tr:4,ly:3};}
  var v=c.riv;if(v&&v.id&&alive(v.id)){fx.rel=fx.rel||{};if(!fx.rel[v.id])fx.rel[v.id]={su:3};}
  var out=applyFx(fx);computeInf();
  addLog('〔晉升〕'+p.title+'（'+ROUTE_N[route]+'）');
  var nx='';
  if(p.rank<4){var rq=C.reqs('std');nx='\n\n下一階「'+PATHS[p.path].ranks[p.rank+1]+'」：功勳需 '+C.meritNeed(p.rank+1)+'（現有 '+p.st.merit+'）。';}
  else nx='\n\n你已登此路之巔。';
  var sc=resultScene('授任·'+PATHS[p.path].ranks[p.rank],ceremony(route,lt)+fxLine(out)+nx,b||'',p.spot,[ch('📈 查看新職','careerMenu'),ch('繼續','hub')]);
  sc.tag='promo';return sc;
 }
 NODES.promote=function(a){
  var p=S.p,c=car(),route=(a&&a.route)||'std';
  if(p.rank>=4)return resultScene('晉升','你已是此路之極。','',p.spot,[ch('返回','careerMenu')]);
  var rq=C.reqs(route);
  if(!rq.ok){
   var miss=rq.items.filter(function(x){return !x.ok;}).map(function(x){return '· '+x.t+'：'+(x.max?(x.lt?x.have+'（須<'+x.need+'）':x.have+'（須≤'+x.need+'）'):x.have+'/'+x.need)+'　'+x.tip;});
   return resultScene('晉升·'+ROUTE_N[route],'條件尚未齊備：\n'+miss.join('\n')+'\n\n（先補齊上列各項，再來申請，不必碰運氣。）','',p.spot,[ch('返回仕途','careerMenu')]);
  }
  var lt=null;
  if(route==='letter'){lt=C.letters()[0];}
  var win=C.win(rq);
  if(roll(win)){
   if(route==='letter'&&lt){if(lt.legacy){delete S.flags['rec_'+p.fac];}else{c.lt.splice(c.lt.indexOf(lt),1);}}
   return doPromote(route,lt);
  }
  /* 敗給競爭者 */
  var v=C.rival();c.pity=Math.min(30,c.pity+10);
  var fx={days:3,st:{}};if(v&&v.id){fx.rel={};fx.rel[v.id]={su:2};}
  var b=bossOf();if(b){fx.rel=fx.rel||{};fx.rel[b]={af:-1};}
  var o=applyFx(fx);
  return resultScene('晉升','你遞上申請，位子卻被「'+(v?v.n:'旁人')+'」搶先一步。上司只是歎道：「時機未到。」\n（你的歷練加成 +'+c.pity+'，下次勝算更高。可請託舉薦、構陷對手，或繼續累積功勳。）'+fxLine(o),b||'',p.spot,[ch('再次申請','promote',{route:route}),ch('返回仕途','careerMenu')]);
 };
 NODES.bribePromo=function(a){
  var p=S.p,c=car();
  if(p.rank>=4)return resultScene('賄賂','你已無需再向誰打點。','',p.spot,[ch('返回','careerMenu')]);
  var rq=C.reqs('bribe');
  if(!rq.ok){
   var miss=rq.items.filter(function(x){return !x.ok;}).map(function(x){return '· '+x.t+'：'+x.have+(x.max?'（須≤'+x.need+'）':'/'+x.need);});
   return resultScene('賄賂','此路門檻尚未達到：\n'+miss.join('\n'),'',p.spot,[ch('返回','careerMenu')]);
  }
  var b=bossOf();var gre=b?NPC[b].gre:50,hon=b?NPC[b].hon:50;var cost=C.bribeCost();
  var pr=clamp(Math.round(42+gre*0.45-hon*0.25+diffMod()),15,88);
  if(!(a&&a.go)){return resultScene('賄賂','你掂量著袋中的 '+cost+' 金。'+(b?nm(b)+'貪念「'+gre+'」、清正「'+hon+'」，':'')+'打點成功率約 '+pr+'%。失敗則損失一半的錢，並可能被人抓住把柄。\n是否打點？','',p.spot,[ch('送上厚禮（-'+cost+'金）','bribePromo',{go:1}),ch('算了','careerMenu')]);}
  if(roll(pr)){
   var sc=doPromote('bribe');return sc;}
  var fx={days:2,st:{gold:-Math.round(cost/2),rep:-2}};
  if(b){fx.rel={};fx.rel[b]={su:8,tr:-4};}
  var exp=roll(25+(hon>60?15:0));if(exp){c.wn=Math.min(3,c.wn+1);fx.st.rep=-5;}
  var o=applyFx(fx);
  return resultScene('賄賂','上司板起臉：「你這是什麼意思？」錢收了，事卻沒辦。'+(exp?'更糟的是，此事傳了出去，你被記了一次怠職（'+c.wn+'/3）。':'')+fxLine(o),b||'',p.spot,[ch('返回','careerMenu')]);
 };
 /* ---- 請託舉薦 ---- */
 function letterCands(){
  var a=[],c=car();
  for(var i=0;i<NPCS.length;i++){var n=NPCS[i];if(n.child||!alive(n.id)||n.age<16)continue;
   var r=S.rel[n.id];if(!r||!r.met)continue;
   var ok=(S.p.fac!=='none'&&facOf(n.id)===S.p.fac&&n.tier>=2)||(S.p.fac==='none'&&n.tier>=3);
   if(!ok)continue;
   var has=false;for(var j=0;j<c.lt.length;j++)if(c.lt[j].id===n.id&&c.lt[j].exp>S.day)has=true;
   if(has)continue;
   a.push({id:n.id,sc:r.tr+r.ly*0.5+r.af*0.3+n.tier*2});}
  a.sort(function(x,y){return y.sc-x.sc;});return a.slice(0,6);
 }
 function letterP(id,gift){var r=R(id);return clamp(Math.round(14+r.tr*0.55+r.ly*0.25+r.af*0.2+Math.min(S.p.st.rep,60)*0.2+(gift?12:0)+diffMod()),5,92);}
 NODES.careerLetterPick=function(){
  var c=car(),cs=[],cd=C.cands=letterCands();
  var t='【請託舉薦】\n舉薦信可讓你以較低的功勳破格申請晉升，並免去資歷與上司賞識的要求。\n信函有效約 10 個月，舉薦人若亡故，信即作廢。\n目前持有：'+C.letters().length+' 封。\n';
  if(!cd.length)t+='\n你還沒有足夠熟識、且有分量的人可以請託。多拜訪同勢力的官員，提高彼此的信任吧。';
  for(var i=0;i<cd.length;i++){var id=cd[i].id;var gift=S.p.st.gold>=60;
   var cdn=c.cd[id]&&c.cd[id]>S.day;
   cs.push(ch('請 '+nm(id)+' 舉薦（成功率約 '+letterP(id,gift)+'%'+(gift?'，薄禮-40金':'')+(cdn?'，近期已被婉拒':'')+'）','careerLetter',{id:id,gift:gift?1:0}));}
  cs.push(ch('↩ 返回','careerMenu'));
  return scene(t,'',{kind:'menu',bg:'study',ch:cs});
 };
 NODES.careerLetter=function(a){

  if(!NPC[id]||!alive(id))return resultScene('請託','此人已不在人世，無從請託。','',S.p.spot,[ch('返回','careerMenu')]);

  var gift=a.gift&&S.p.st.gold>=40;var pr=letterP(id,gift);var fx={days:3,st:{},rel:{}};

   t=nm(id)+'提筆寫下舉薦書，蓋上私印：「我替你作保。莫要辜負了。」\n（獲得舉薦信一封，十個月內有效。）';addLog('〔舉薦〕'+nm(id)+'為你寫下舉薦書');}
  else{c.cd[id]=S.day+90;fx.rel[id]={af:-1};t=nm(id)+'沉吟良久，搖頭：「你的資歷尚淺，此時舉薦，反倒害了你。」';}
  var o=applyFx(fx);

 NODES.careerIntrigue=function(){
  var p=S.p,c=car(),v=C.rival(),b=bossOf();
  if(!v)return resultScene('構陷','此路已無對手可言。','',p.spot,[ch('返回','careerMenu')]);

   if(v.id)fx.rel[v.id]={ha:6,su:4};
   t=(pal?'你在貴人耳邊「不經意」提起':'你不動聲色地讓上司聽到了')+'「'+v.n+'」的幾樁小過。對方的聲勢眼見矮了一截。';
  }else{
   v.pw+=4;fx.st={rep:-3};if(b)fx.rel[b]={tr:-4,su:3};if(v.id)fx.rel[v.id]={ha:8};
   t='你的小動作被人察覺，反被指為挑撥是非。「'+v.n+'」冷冷看了你一眼。';
  }
  var o=applyFx(fx);
  return resultScene(pal?'進讒':'構陷',t+'\n（成功率約 '+pr+'%）'+fxLine(o),b||'',p.spot,[ch('返回仕途','careerMenu')]);

 /* ---- 履行職司 ---- */
 NODES.careerPost=function(){
  var p=S.p,c=car(),ps=C.post();
  if(p.fac==='none'&&p.path!=='wander')return resultScene('職司','你無所屬，沒有職司可言。','',p.spot,[ch('返回','careerMenu')]);
  var m=3+p.rank+Math.floor(pStat(PATHS[p.path].stat)/30);
  var fx={days:8,st:{merit:m,gold:ps.sal*2+5},rel:{}};
  if(ps.troop>0&&p.st.troop<10*p.rank+10)fx.st.troop=Math.min(2,ps.troop);
  if(roll(14))fx.st[PATHS[p.path].stat]=1;
  var b=bossOf();if(b)fx.rel[b]={tr:1};
  if(p.path==='consort'&&S.emp&&alive(S.emp))fx.rel[S.emp]={af:1,lo:roll(40)?1:0};
  if(roll(30))fx.st.rep=1;
  if(S.fac[p.fac]&&p.fac!=='none'){fx.fac={};fx.fac[p.fac]=0.2;}
  var o=applyFx(fx);c.pf=Math.min(100,c.pf+10);c.wk=S.day;
  var streak='';
  if(c.pf>=80){c.pf=80;streak='\n〔勤勉〕考績 80，保持良好。';}
  return resultScene('職司·'+ps.rank,'你履行「'+ps.rank+'」之責——'+ps.duty+'。\n'+pick(ACT[grp()])+streak+fxLine(o),b||'',p.spot,[ch('再履行一次','careerPost'),ch('返回仕途','careerMenu')]);
 };

 C.demote=function(why){
  var p=S.p,c=car();if(p.rank<=0)return false;
  p.rank--;p.title=titleOf();p.st.merit=Math.round(p.st.merit*0.75);
  c.lr=p.rank;c.lp=S.day;c.riv=null;c.wn=0;c.pf=45;c.pity=0;c.hist.push({d:S.day,r:p.rank,t:p.title,v:'降職'});if(c.hist.length>12)c.hist.shift();
  addLog('〔降職〕'+why+'，降為「'+p.title+'」');
  if(window.Canon)Canon.note(why+'，降為「'+p.title+'」（'+dateStr()+'）');
  S.pending.push(scene('【降職】\n'+why+'。\n\n你被降為「'+p.title+'」，功勳折損四分之一。\n（想重新爬上去，就從履行職司與補齊條件開始吧。）','',{kind:'result',bg:'study',ch:[ch('📈 查看仕途','careerMenu'),ch('繼續','hub')]}));
  computeInf();return true;
 };

 C.monthly=function(){
  var p=S.p;if(!p)return;var c=car();
  var ps=C.post();
  var onduty=(p.fac!=='none'&&S.fac[p.fac]&&S.fac[p.fac].pw>0);
  if(onduty){
   p.st.merit+=1+(c.pf>=50?1:0);
   p.st.gold+=ps.sal;
   if(ps.troop>0&&p.st.troop<10*p.rank+10)p.st.troop=Math.min(100,p.st.troop+Math.max(1,Math.floor(ps.troop/2)));
   if(p.rank>=3)p.st.gold+=8*p.rank;
   if(S.day%90===0)addLog('〔俸祿〕職司「'+ps.duty+'」加給+'+ps.sal+'金'+(ps.troop?'，部曲增長':'')+'；年資功勳累計中');
  }
  c.pf=Math.max(0,c.pf-6);
  if(c.riv&&c.riv.r===p.rank+1)c.riv.pw=Math.min(95,c.riv.pw+0.8);
  /* 舉薦邀約 */
  var cl=c.lt.length;c.lt=c.lt.filter(function(l){return l.exp>S.day&&alive(l.id);});
  if(onduty&&p.rank<4&&C.letters().filter(function(l){return !l.legacy;}).length<2&&roll(9)){
   var cs=letterCands().filter(function(x){var r=S.rel[x.id];return r&&r.tr+r.ly*0.5>=45;});
   if(cs.length){var g=cs[0].id;c.lt.push({id:g,d:S.day,exp:S.day+300,q:NPC[g].tier>=4?2:1});addLog('〔舉薦〕'+nm(g)+'主動為你寫下舉薦書');toast('📮 '+nm(g)+'有意舉薦你（獲得舉薦信）',3000);}
  }
  /* 年中考績 */
  if(onduty&&p.rank>=0&&S.day-c.rev>=180){
   c.rev=S.day;var lim={easy:20,normal:30,hard:38,hell:45}[SET.diff]||30;
   if(c.pf>=60){c.wn=Math.max(0,c.wn-1);p.st.gold+=40+p.rank*30;p.st.merit+=4;p.st.rep=Math.min(100,p.st.rep+2);addLog('〔考績〕優等：聲望+2，賞金'+(40+p.rank*30)+'，功勳+4');toast('考績優等！賞金與功勳',2600);}
   else if(c.pf<lim){c.wn++;addLog('〔考績〕劣等：怠職警告 '+c.wn+'/3');toast('⚠ 考績劣等，怠職警告 '+c.wn+'/3',3200);
    if(c.wn>=3&&p.rank>0)C.demote('因屢次怠職、考績低劣，被上司降職');else if(c.wn>=3){c.wn=2;}}
   else addLog('〔考績〕平等');
  }
  /* 犯案革職 */
  if(onduty&&p.rank>0&&(p.wanted||0)>=65&&S.day-(c.cc||-999)>60){c.cc=S.day;C.demote('因身負重案、聲名狼藉，被革去官職');}
  checkReady();
 };

 if(!S||!S.p||S.p.path!=='soldier')return;
 var x=X();var L=jueLv();
 if(x.jue===undefined){x.jue=L;return;}
 if(L>x.jue){
  var from=x.jue;x.jue=L;
  var gold=0;for(var l=from+1;l<=L;l++)gold+=15*l;
  var gain=[];for(l=from+1;l<=L;l++){if(JUE_GAIN[l-1])gain.push('【'+JUE[l-1]+'】'+JUE_GAIN[l-1]);}
  var fx={days:0,st:{gold:gold,rep:Math.min(4,L-from+1)}};

  addLog('〔授爵〕晉爵「'+JUE[L-1]+'」（第'+L+'級）');
  addNews(S.p.name+'因軍功晉爵為「'+JUE[L-1]+'」。');

function freeHeur(text,ids,hint){
 var rule=null;for(var i=0;i<FREE_RULES.length;i++){if(FREE_RULES[i].re.test(text)){rule=FREE_RULES[i];break;}}
 if(!rule){
  var lines=['你若有所思地做了一番盤算，最終決定順其自然。','你按自己的想法行事，雖無驚人之舉，卻也積累了一些見聞。','你照自己的意思去做了，這一天平平淡淡地過去。'];
  var g=ids.length?'你想著'+nm(ids[0])+'，一時心思飄遠。':'';
  var o0=applyFx({days:2,st:{zhi:roll(20)?1:0}});
  return resultScene('行動','「'+text.slice(0,40)+'」\n'+pick(lines)+(g?'\n'+g:'')+hint+fxLine(o0),'',S.p.spot);
 }
 var tg=ids.length?ids[0]:'';
 if(tg&&locOf(tg)!==S.p.region&&rule.t)return resultScene(rule.n,nm(tg)+'現在在'+regionName(locOf(tg))+'，你需先趕往當地。','',S.p.spot);
 if(rule.cost&&S.p.st.gold<rule.cost)return resultScene(rule.n,'你身上的錢不夠（需要至少 '+rule.cost+' 金）。','',S.p.spot);
 var wit=0;try{var hn=hereNpcs();for(i=0;i<hn.length;i++){if(hn[i]!==tg&&NPC[hn[i]].tier>=1&&spotOf(hn[i])===S.p.spot)wit++;}}catch(e){}
 var sv=rule.s==='luck'?30:pStat(rule.s);
 var p=clamp(rule.b+sv*0.55+diffMod()-(rule.crime?wit*5:0),6,94);
 var ok=rollD(p);
 var res=ok?rule.ok(tg):rule.ng(tg);
 var d=res[1]||{};var fx={days:rule.k==='trade'||rule.k==='tail'?2:1,st:{},rel:{}};
 if(d.st0)for(var sk in d.st0)fx.st[sk]=d.st0[sk];
 if(d.gold)fx.st.gold=(fx.st.gold||0)+d.gold;
 if(rule.cost&&(ok||rule.k==='bribe')&&rule.k!=='help')fx.st.gold=(fx.st.gold||0)-rule.cost;
 if(rule.k==='help'&&ok)fx.st.gold=(fx.st.gold||0)-rule.cost;
 if(d.rel&&tg){var rr={};for(var rk in d.rel)rr[rk]=ok?d.rel[rk]:d.rel[rk];fx.rel[tg]=rr;}
 if(d.bounty){fx.bounty=Math.max(1,Math.round(d.bounty*(typeof DS==='function'?DS():1)));}
 if(d.bountyDown&&S.p.wanted){fx.bounty=-Math.min(S.p.wanted,d.bountyDown);}
 if(d.flag)S.flags[d.flag]=S.day;
 if(rule.hook&&ok){S.flags['route_'+rule.hook]=S.day;}
 var o=applyFx(fx);
 if(S.p.st.hp<=0)return endingScene('die_hp');
 var head=(rule.crime&&wit>0?'（周圍有 '+wit+' 雙眼睛）':'')+'〔'+rule.n+'：'+(ok?'成功':'失敗')+'・約'+Math.round(p)+'%〕\n';
 if(rule.k==='rebel')res[0]+='\n（完整的「起義稱帝」路線將在後續版本推出；你可在「前程路線」登記意向。）';
 return resultScene(rule.n,'「'+text.slice(0,40)+'」\n'+head+res[0]+fxLine(o),tg||'',S.p.spot);
}

  var byY={};for(i=0;i<S.log.length;i++){var y=ymd(S.log[i].d).y;(byY[y]=byY[y]||[]).push(S.log[i]);}
  var ys=Object.keys(byY).map(Number).sort(function(a,b){return b-a;});
  for(i=0;i<ys.length&&i<4;i++){var arr=byY[ys[i]];h+='<div class="mem" style="margin-top:8px"><b>'+esc(yrStr(ys[i]))+'</b></div>';for(var j=Math.max(0,arr.length-14);j<arr.length;j++)h+='<div class="mem">'+esc(MONTH_N[ymd(arr[j].d).m])+'　'+esc(arr[j].t)+'</div>';}
  if(!ys.length)h+='<div class="hint">（日記是空的）</div>';h+='</div>';
 }else{
  h+='<div class="sec"><h4>關係圖</h4><div class="hint">與你往來最密切的人（信任／好感／懷疑／恨）</div>';
  var rows=[];for(i=0;i<ids.length;i++){id=ids[i];if(!NPC[id]||!alive(id))continue;r=S.rel[id];rows.push([r.tr+r.af+r.su+r.ha+r.fe+r.re,id]);}
  rows.sort(function(a,b){return b[0]-a[0];});
  for(i=0;i<rows.length&&i<14;i++){id=rows[i][1];r=S.rel[id];h+='<div class="mem"><b>'+esc(nm(id))+'</b> <span class="hint">'+esc(FACTIONS[facOf(id)]?FACTIONS[facOf(id)].n:'')+'</span><br>信 '+bkBar(r.tr,'#3fa6a0')+' 好 '+bkBar(r.af,'#d86a8a')+' 疑 '+bkBar(r.su,'#7a4a9a')+' 恨 '+bkBar(r.ha,'#b8322a')+' 怕 '+bkBar(r.fe,'#8a6a3a')+' 敬 '+bkBar(r.re,'#d9a93a')+'</div>';}
  if(!rows.length)h+='<div class="hint">還沒有任何往來。</div>';h+='</div>';
 }
 return h;
};
