<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#120c0b">
<title>浮生天下</title>
<style>
:root{--fs:17px;--bg:#120c0b;--bg2:#1f1412;--bg3:#33201c;--ink:#f6ecd0;--dim:#b9a98a;--gold:#d9a93a;--red:#b8322a;--redl:#d8473a;--jade:#3fa6a0;--blue:#2f4a7a;--bd:#0d0907;--panel:#1f2630;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);font-family:"PingFang TC","PingFang HK","Heiti TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%;overflow:hidden;}
body{background:radial-gradient(ellipse at top,#2a1512 0,#0a0606 80%);}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
canvas{image-rendering:-webkit-optimize-contrast;image-rendering:-moz-crisp-edges;image-rendering:crisp-edges;image-rendering:pixelated;}
#app{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;height:100%;max-width:1180px;margin:0 auto;padding:var(--sat) var(--sar) 0 var(--sal);position:relative;}
#top{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:6px;padding:6px 8px;background:#190d0c;border-bottom:3px solid #0d0907;box-shadow:0 3px 0 #7a2a22;-webkit-flex:0 0 auto;flex:0 0 auto;z-index:5;}
#pbadge{width:36px;height:36px;border:2px solid var(--gold);background:#333;-webkit-flex:0 0 auto;flex:0 0 auto;}
#pbadge canvas{width:100%;height:100%;display:block;}
#tinfo{-webkit-flex:1;flex:1;min-width:0;line-height:1.25;}
#tdate{font-size:12px;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#ttitle{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#tbtns{display:-webkit-flex;display:flex;gap:4px;-webkit-flex:0 0 auto;flex:0 0 auto;}
.ib{min-width:38px;height:36px;padding:0 6px;border:0;background:#5e2420;color:var(--ink);font-size:16px;cursor:pointer;box-shadow:inset -2px -2px 0 #1a0b0a,inset 2px 2px 0 #b0623a;border-radius:0;}
.ib:active{background:#8a3228;}
#main{display:-webkit-flex;display:flex;-webkit-flex:1;flex:1;min-height:0;}
#col{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-flex:1;flex:1;min-width:0;min-height:0;}
#side{display:none;width:300px;-webkit-flex:0 0 300px;flex:0 0 300px;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#1a1410;border-left:3px solid #0d0907;padding:8px;}
@media (min-width:980px){#side{display:block;}}
#stagewrap{-webkit-flex:0 0 auto;flex:0 0 auto;display:-webkit-flex;display:flex;-webkit-justify-content:center;justify-content:center;background:#0d0907;padding:0;}
#stage{position:relative;width:100%;max-width:calc(34vh * 1.7778);}
#stage:before{content:"";display:block;padding-top:56.25%;}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;}
#place{position:absolute;left:6px;top:6px;padding:2px 8px;background:rgba(20,12,8,.8);border:2px solid var(--gold);font-size:12px;color:var(--ink);}
#kindtag{position:absolute;right:6px;top:6px;padding:2px 8px;background:rgba(120,30,24,.9);border:2px solid #f0cf6a;font-size:12px;display:none;}
#story{-webkit-flex:1;flex:1;min-height:60px;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:6px 6px 0;padding:8px 10px;background:var(--panel);border:3px solid var(--gold);box-shadow:0 0 0 3px var(--bd),inset 0 0 0 2px #0d0907;position:relative;}
#spk{display:none;-webkit-align-items:center;align-items:center;gap:8px;margin-bottom:6px;}
#spk canvas{width:56px;height:56px;border:2px solid var(--gold);background:#333;-webkit-flex:0 0 auto;flex:0 0 auto;}
#spname{font-weight:bold;color:var(--gold);font-size:calc(var(--fs) + 1px);}
#spsub{font-size:12px;color:var(--dim);}
#txt{font-size:var(--fs);line-height:1.7;white-space:pre-wrap;word-break:break-word;}
#txt .fx{color:#9fe0a0;font-size:.88em;}
#txt .hd{color:var(--gold);font-weight:bold;}
#txt .say{color:#ffe9b0;}
#txt .ai{color:#8fd3ff;}
#aitag{display:none;font-size:11px;color:#8fd3ff;margin-bottom:4px;}
#skip{position:absolute;right:6px;bottom:4px;font-size:11px;color:var(--dim);display:none;}
#bottom{-webkit-flex:0 1 auto;flex:0 1 auto;max-height:44%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 6px 0;}
#choices{display:grid;grid-template-columns:1fr;gap:6px;}
@media (min-width:560px){#choices{grid-template-columns:1fr 1fr;}}
.glab{grid-column:1/-1;font-size:12px;color:var(--gold);margin-top:2px;padding-left:4px;border-left:3px solid var(--red);}
.cbtn{display:block;width:100%;text-align:left;padding:9px 10px;min-height:42px;background:#3a2a20;border:0;color:var(--ink);font-size:calc(var(--fs) - 1px);line-height:1.35;cursor:pointer;box-shadow:inset -3px -3px 0 #1e130c,inset 3px 3px 0 #7a5236,0 0 0 2px #0d0907;border-radius:0;}
.cbtn:active,.cbtn:hover{background:#5e2420;}
.cbtn.ai{background:#1f3a4a;box-shadow:inset -3px -3px 0 #0c1c26,inset 3px 3px 0 #3a7a9a,0 0 0 2px #0d0907;}
.cbtn.back{background:#2a2a30;box-shadow:inset -3px -3px 0 #141418,inset 3px 3px 0 #5a5a68,0 0 0 2px #0d0907;}
.cbtn.pk{padding:8px 8px;}
#freebox{-webkit-flex:0 0 auto;flex:0 0 auto;display:-webkit-flex;display:flex;gap:6px;padding:6px 6px calc(6px + var(--sab));}
#free{-webkit-flex:1;flex:1;min-width:0;height:42px;padding:0 10px;font-size:16px;background:#141a22;border:3px solid #7a2a22;border-radius:0;color:var(--ink);-webkit-appearance:none;appearance:none;outline:0;}
#free:focus{border-color:var(--gold);}
.gobtn{height:42px;padding:0 12px;border:0;background:var(--red);color:#fff;font-size:15px;box-shadow:inset -3px -3px 0 #6a1a16,inset 3px 3px 0 #e8685a,0 0 0 2px #0d0907;cursor:pointer;border-radius:0;white-space:nowrap;}
.gobtn.alt{background:#3a5a8a;box-shadow:inset -3px -3px 0 #1c2c4a,inset 3px 3px 0 #6a90c0,0 0 0 2px #0d0907;}
.gobtn.sm{height:34px;font-size:14px;padding:0 10px;}
.gobtn.dark{background:#4a3a2e;box-shadow:inset -3px -3px 0 #231a12,inset 3px 3px 0 #7a6552,0 0 0 2px #0d0907;}
/* overlay / modal */
.ov{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(5,3,2,.82);z-index:20;display:none;-webkit-align-items:stretch;align-items:stretch;-webkit-justify-content:center;justify-content:center;padding:var(--sat) var(--sar) var(--sab) var(--sal);}
.ov.on{display:-webkit-flex;display:flex;}
.box{width:100%;max-width:760px;margin:6px;background:#241a14;border:3px solid var(--gold);box-shadow:0 0 0 3px var(--bd);display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;min-height:0;}
.bhead{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:4px;padding:6px;background:#3a2218;border-bottom:3px solid #0d0907;-webkit-flex:0 0 auto;flex:0 0 auto;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.tab{-webkit-flex:0 0 auto;flex:0 0 auto;padding:7px 10px;border:0;background:#3e1f1a;color:var(--dim);font-size:14px;cursor:pointer;border-radius:0;white-space:nowrap;box-shadow:inset -2px -2px 0 #24160c,inset 2px 2px 0 #7a2a22;}
.tab.on{background:var(--red);color:#fff;box-shadow:inset -2px -2px 0 #6a1a16,inset 2px 2px 0 #e8685a;}
.bbody{-webkit-flex:1;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px;font-size:15px;line-height:1.6;}
.sec{margin:0 0 12px;padding:8px;background:#1a120d;border:2px solid #3e1f1a;}
.sec h4{margin:0 0 6px;color:var(--gold);font-size:15px;}
.row{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:8px;margin:4px 0;}
.row>label{-webkit-flex:0 0 7.5em;flex:0 0 7.5em;font-size:14px;color:#ddd0b0;}
.row.st{margin:3px 0;}
.bar{-webkit-flex:1;flex:1;height:10px;background:#0d0907;border:1px solid #5a4030;position:relative;min-width:40px;}
.bar i{position:absolute;left:0;top:0;bottom:0;display:block;}
.num{font-size:13px;min-width:2.2em;text-align:right;color:var(--ink);}
.hint{font-size:12px;color:var(--dim);line-height:1.5;}
.pill{display:inline-block;padding:1px 7px;margin:2px 3px 2px 0;background:#3a2a20;border:1px solid #7a2a22;font-size:12px;}
.field{width:100%;height:40px;padding:0 8px;font-size:16px;background:#141a22;border:2px solid #7a2a22;color:var(--ink);border-radius:0;-webkit-appearance:none;appearance:none;}
select.field{background-image:none;}
textarea.field{height:110px;padding:6px 8px;font-size:13px;line-height:1.4;}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:22px;background:transparent;}
input[type=range]::-webkit-slider-runnable-track{height:8px;background:#0d0907;border:1px solid #7a2a22;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:22px;background:var(--gold);border:2px solid #0d0907;margin-top:-8px;}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--red);}
.slot{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:6px;flex-wrap:wrap;padding:6px;margin-bottom:6px;background:#1a120d;border:2px solid #3e1f1a;}
.slot .m{-webkit-flex:1 1 160px;flex:1 1 160px;font-size:13px;line-height:1.4;}
.rrow{display:-webkit-flex;display:flex;gap:8px;padding:6px;margin-bottom:5px;background:#1a120d;border:2px solid #3e1f1a;cursor:pointer;-webkit-align-items:center;align-items:center;}
.rrow canvas{width:44px;height:44px;-webkit-flex:0 0 auto;flex:0 0 auto;border:2px solid #7a2a22;}
.rrow .nm{font-size:15px;}.rrow .sb{font-size:12px;color:var(--dim);}
.rd{padding:6px 8px 8px;margin:-4px 0 6px;background:#150e0a;border:2px solid #3e1f1a;border-top:0;font-size:13px;}
.mem{font-size:12px;color:#c9b88e;padding-left:8px;border-left:2px solid #7a2a22;margin:3px 0;}
.opt{display:inline-block;margin:3px 4px 3px 0;padding:8px 10px;border:0;background:#3a2a20;color:var(--ink);font-size:14px;cursor:pointer;border-radius:0;box-shadow:inset -2px -2px 0 #1e130c,inset 2px 2px 0 #7a5236;}
.opt.on{background:var(--red);box-shadow:inset -2px -2px 0 #6a1a16,inset 2px 2px 0 #e8685a;}
.opt.dis{opacity:.35;pointer-events:none;}
.title-screen{text-align:center;padding:10px;}
.title-screen h1{font-size:34px;letter-spacing:6px;margin:6px 0 2px;color:var(--gold);text-shadow:3px 3px 0 #7e1f1b,5px 5px 0 #000;}
.title-screen .sub{color:var(--dim);font-size:13px;margin-bottom:10px;}
.mbtns{display:grid;gap:8px;max-width:300px;margin:12px auto;}
#toast{position:fixed;left:50%;bottom:calc(70px + var(--sab));-webkit-transform:translateX(-50%);transform:translateX(-50%);max-width:92%;padding:8px 14px;background:rgba(10,6,4,.95);border:3px solid var(--gold);color:var(--ink);font-size:14px;z-index:60;display:none;white-space:pre-wrap;line-height:1.5;}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.statrow{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:6px;margin:3px 0;}
.statrow label{width:3.2em;font-size:14px;}.statrow b{width:2.2em;text-align:center;}
.smallb{width:30px;height:30px;border:0;background:#5e2420;color:var(--ink);font-size:18px;box-shadow:inset -2px -2px 0 #1a0b0a,inset 2px 2px 0 #b0623a;border-radius:0;}
.fwarn{color:#ff9a8a;font-size:13px;}
.mapbox{position:relative;width:100%;height:230px;background:#16282a;border:2px solid #3e1f1a;overflow:hidden;}
.mapbox .pt{position:absolute;-webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%);text-align:center;font-size:11px;line-height:1.1;white-space:nowrap;}
.mapbox .pt i{display:block;width:12px;height:12px;margin:0 auto 1px;border:2px solid #0d0907;}
.mapbox .you i{outline:2px solid #fff;}
@media (max-width:420px){.row>label{-webkit-flex-basis:6em;flex-basis:6em;}.title-screen h1{font-size:28px;}}
.hot{position:absolute;display:block;padding:0;margin:0;border:2px solid transparent;background:transparent;cursor:pointer;-webkit-appearance:none;appearance:none;border-radius:0;color:#fff;font-size:11px;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
.hot span{position:absolute;left:50%;bottom:100%;font-size:10px;-webkit-transform:translateX(-50%);transform:translateX(-50%);white-space:nowrap;padding:0 4px;background:rgba(20,10,5,.78);border:1px solid #d9a93a;opacity:.92;pointer-events:none}
.hot:hover,.hot:active,.hot.on{border-color:#f0cf6a;background:rgba(255,230,120,.18)}
.hot:hover span,.hot:active span,.hot.on span{opacity:1}
#hots{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none}
#hots .hot{pointer-events:auto}
.tagrow{margin:4px 0}
.ach{display:-webkit-flex;display:flex;gap:8px;padding:6px;margin-bottom:5px;background:#1a120d;border:2px solid #3e1f1a}
.ach.lock{opacity:.45}
.ach b{color:#d9a93a}
.shopitem{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:8px;padding:6px;margin-bottom:5px;background:#1a120d;border:2px solid #3e1f1a}

/* ===== 古風皮膚 v3：金邊卷軸、紅木按鈕、轉場與入場動畫 ===== */
#top{background:linear-gradient(180deg,#3a2216 0,#24150d 100%);border-bottom:3px solid #0d0907;box-shadow:0 3px 0 #7a2a22,0 5px 0 #d9a93a55;}
#pbadge{display:none;box-shadow:0 0 0 2px #0d0907,0 0 0 4px #7a2a22;}
#stagewrap{background:#0d0907;border-bottom:3px solid #d9a93a;box-shadow:0 2px 0 #0d0907,0 4px 0 #7a2a22;}
#stage{box-shadow:0 0 0 3px #0d0907,0 0 0 5px #d9a93a,0 0 0 7px #0d0907;}
#story{background:linear-gradient(180deg,#2a323f 0,#1e2531 55%,#1a2029 100%);border:3px solid #d9a93a;box-shadow:0 0 0 2px #0d0907,0 0 0 4px #7a2a22,inset 0 0 0 2px #0d0907,inset 0 0 0 3px #8a6a22,inset 0 0 22px rgba(0,0,0,.55);}
#spk canvas{border:2px solid #f0cf6a;box-shadow:0 0 0 2px #0d0907,0 0 0 4px #7a2a1e;}
#spname{text-shadow:1px 1px 0 #000;letter-spacing:1px;}
#spname:before{content:"◆ ";color:var(--red);}
#place{background:linear-gradient(180deg,#4a1e16,#2a0f0a);border:2px solid #f0cf6a;box-shadow:0 0 0 1px #0d0907;letter-spacing:1px;}
#txt .cur{color:#f0cf6a;animation:blink 0.8s steps(2,start) infinite;}
@-webkit-keyframes blink{to{visibility:hidden}}
@keyframes blink{to{visibility:hidden}}
.cbtn{border-radius:0;-webkit-appearance:none;appearance:none;background:linear-gradient(180deg,#74301f 0,#52221a 55%,#431b13 100%);color:#fbeed0;border-left:0;box-shadow:inset 0 0 0 1px rgba(240,207,106,.35),inset -3px -3px 0 #2a0f0a,inset 3px 3px 0 #a0523a,0 0 0 2px #0d0907;text-shadow:1px 1px 0 #1a0a06;-webkit-animation:optIn .3s ease-out both;animation:optIn .3s ease-out both;}
.cbtn:hover,.cbtn:active{background:linear-gradient(180deg,#8a3a26 0,#64291e 100%);}
.cbtn:nth-child(2){-webkit-animation-delay:.04s;animation-delay:.04s}.cbtn:nth-child(3){-webkit-animation-delay:.08s;animation-delay:.08s}
.cbtn:nth-child(4){-webkit-animation-delay:.12s;animation-delay:.12s}.cbtn:nth-child(5){-webkit-animation-delay:.16s;animation-delay:.16s}
.cbtn:nth-child(6){-webkit-animation-delay:.2s;animation-delay:.2s}.cbtn:nth-child(7){-webkit-animation-delay:.24s;animation-delay:.24s}
.cbtn:nth-child(8){-webkit-animation-delay:.28s;animation-delay:.28s}.cbtn:nth-child(n+9){-webkit-animation-delay:.32s;animation-delay:.32s}
@-webkit-keyframes optIn{from{opacity:0;-webkit-transform:translateY(8px)}to{opacity:1;-webkit-transform:none}}
@keyframes optIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.glab{color:#f0cf6a;border-left:3px solid var(--red);letter-spacing:1px;}
.gobtn{background:linear-gradient(180deg,#c8423a,#8a241c);}
.ib{background:linear-gradient(180deg,#7a2a22,#4a2c1c);}
.box{border:3px solid #d9a93a;box-shadow:0 0 0 3px var(--bd),0 0 0 5px #7a2a22,inset 0 0 0 2px #0d0907;background:linear-gradient(180deg,#2a1f18,#201610);}
.bhead{background:linear-gradient(180deg,#4a2a1c,#2e1a10);}
.sec{border:2px solid #5a4030;box-shadow:inset 0 0 0 1px #0d0907,inset 0 0 0 2px #3a2a1a;}
.sec h4{border-bottom:1px solid #7a2a22;padding-bottom:3px;letter-spacing:1px;}
.tab.on,.opt.on{background:linear-gradient(180deg,#c8423a,#8a241c);}
#cv.wipe{-webkit-animation:wipeIn .55s ease-out both;animation:wipeIn .55s ease-out both;}
@-webkit-keyframes wipeIn{from{-webkit-clip-path:inset(0 100% 0 0);clip-path:inset(0 100% 0 0);opacity:.4}to{-webkit-clip-path:inset(0 0 0 0);clip-path:inset(0 0 0 0);opacity:1}}
@keyframes wipeIn{from{-webkit-clip-path:inset(0 100% 0 0);clip-path:inset(0 100% 0 0);opacity:.4}to{-webkit-clip-path:inset(0 0 0 0);clip-path:inset(0 0 0 0);opacity:1}}
#cv.fade{-webkit-animation:fadeIn .45s ease-out both;animation:fadeIn .45s ease-out both;}
@-webkit-keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#story.pop{-webkit-animation:storyIn .3s ease-out both;animation:storyIn .3s ease-out both;}
@-webkit-keyframes storyIn{from{opacity:.2;-webkit-transform:translateY(5px)}to{opacity:1;-webkit-transform:none}}
@keyframes storyIn{from{opacity:.2;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.cbtn,#cv.wipe,#cv.fade,#story.pop{-webkit-animation:none;animation:none}}
body.noanim .cbtn,body.noanim #cv.wipe,body.noanim #cv.fade,body.noanim #story.pop{-webkit-animation:none;animation:none}
@media (max-width:420px){#stage{box-shadow:0 0 0 2px #0d0907,0 0 0 4px #d9a93a,0 0 0 6px #0d0907;}}

#aibar{display:none;-webkit-flex:0 0 auto;flex:0 0 auto;-webkit-align-items:center;align-items:center;gap:6px;margin:4px 6px 0;padding:5px 8px;background:#3a1a14;border:2px solid #c0503a;color:#ffd9cf;font-size:13px;line-height:1.45;z-index:6;max-height:30vh;overflow-y:auto;}
#aibar.wait{background:#1d2a3a;border-color:#4a7aa8;color:#cfe6ff;}
#aibar #aibarmsg{-webkit-flex:1;flex:1;white-space:pre-wrap;word-break:break-all;}
#aibar .aibtn{-webkit-flex:0 0 auto;flex:0 0 auto;background:#241812;color:#f1e3c4;border:2px solid #8a6a22;font-size:13px;padding:3px 8px;min-height:30px;min-width:32px;font-family:inherit;cursor:pointer;}

/* ===== V4 橫向場景 UI：木框＋卷軸紙感 HUD ===== */
#stage{--u:6px;max-width:calc(52vh * 1.7778);font-size:calc(var(--u)*2.1);}
#hudL{position:absolute;left:calc(var(--u)*1.2);top:calc(var(--u)*1.2);display:-webkit-flex;display:flex;gap:calc(var(--u)*.8);padding:calc(var(--u)*.7) calc(var(--u)*1.2) calc(var(--u)*.7) calc(var(--u)*.7);background:linear-gradient(180deg,#f0e2bc,#dcc89a);border:calc(var(--u)*.45) solid #5a2a24;box-shadow:0 0 0 1px #c8a460 inset,0 2px 0 rgba(0,0,0,.4);color:#2e1612;z-index:3;pointer-events:none;min-width:calc(var(--u)*24);}
#hudpw{width:calc(var(--u)*7);height:calc(var(--u)*7);border-radius:50%;border:calc(var(--u)*.4) solid #5a2a24;overflow:hidden;background:#889;-webkit-flex:0 0 auto;flex:0 0 auto;box-shadow:0 0 0 1px #d9a93a;}
#hudp{width:100%;height:100%;display:block;}
#hudL .hb{min-width:0;-webkit-flex:1;flex:1;}
#hudn{font-weight:bold;white-space:nowrap;font-size:1em;line-height:1.15;}
.hbar{position:relative;height:calc(var(--u)*1.6);margin-top:calc(var(--u)*.35);background:#2e1612;border:1px solid #2a1a0c;}
.hbar i{position:absolute;left:0;top:0;bottom:0;display:block;}
.hbar.r i{background:linear-gradient(#f06a5a,#b8322a);}
.hbar.b i{background:linear-gradient(#6aa8f0,#2f5aa8);}
.hbar span{position:absolute;left:0;right:0;top:0;bottom:0;text-align:center;font-size:.72em;line-height:calc(var(--u)*1.6);color:#fff;text-shadow:1px 1px 0 #000;}
#hudlv{font-size:.8em;margin-top:calc(var(--u)*.3);color:#7a2a22;white-space:nowrap;}
#hudR{position:absolute;right:calc(var(--u)*1.2);top:calc(var(--u)*1.2);width:calc(var(--u)*27);z-index:3;pointer-events:none;}
#hudd{padding:calc(var(--u)*.6) calc(var(--u)*1);background:linear-gradient(180deg,#f0e2bc,#dcc89a);border:calc(var(--u)*.45) solid #5a2a24;box-shadow:0 0 0 1px #c8a460 inset;color:#2e1612;font-weight:bold;text-align:center;white-space:nowrap;}
#hudg{margin-top:calc(var(--u)*.5);padding:calc(var(--u)*.4) calc(var(--u)*1);background:linear-gradient(180deg,#f0e2bc,#dcc89a);border:calc(var(--u)*.45) solid #5a2a24;color:#7a4a10;font-weight:bold;text-align:right;}
#hudg:before{content:"";display:inline-block;width:.8em;height:.8em;border-radius:50%;background:#e8b830;border:1px solid #8a6a10;margin-right:.4em;vertical-align:-.1em;}
#board{margin-top:calc(var(--u)*.6);background:linear-gradient(180deg,#f2e6c4,#e2d0a4);border:calc(var(--u)*.45) solid #5a2a24;box-shadow:0 0 0 1px #c8a460 inset;color:#2e1612;padding:calc(var(--u)*.6) calc(var(--u)*1) calc(var(--u)*.8);}
#boardt{text-align:center;font-weight:bold;color:#7a2a1e;border-bottom:1px solid #b8985a;margin-bottom:calc(var(--u)*.4);font-size:.95em;}
#boardl div{font-size:.8em;line-height:1.35;margin:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#boardl div:before{content:"◆ ";color:#b8322a;}
#hotbar{position:absolute;left:50%;bottom:calc(var(--u)*1);-webkit-transform:translateX(-50%);transform:translateX(-50%);display:-webkit-flex;display:flex;gap:calc(var(--u)*.5);padding:calc(var(--u)*.6);background:rgba(240,226,188,.92);border:calc(var(--u)*.45) solid #5a2a24;box-shadow:0 0 0 1px #c8a460 inset;z-index:3;pointer-events:none;}
#hotbar .sl{position:relative;width:calc(var(--u)*5);height:calc(var(--u)*5);background:#e8d8ac;border:2px solid #8a6a3a;}
#hotbar .sl.sel{border-color:#e8a010;box-shadow:0 0 6px #ffcf40;}
#hotbar .sl canvas{width:100%;height:100%;display:block;}
#hotbar .sl b{position:absolute;right:1px;bottom:0;font-size:.62em;color:#2e1612;text-shadow:0 0 2px #fff;}
#hotbar .sl em{position:absolute;left:2px;top:0;font-size:.55em;color:#7a5a30;font-style:normal;}
#ebub{position:absolute;display:none;z-index:4;padding:calc(var(--u)*.5) calc(var(--u)*1.2);background:#fffdf4;color:#2a1a0c;border:2px solid #5a2a24;border-radius:calc(var(--u)*1.4);font-weight:bold;white-space:nowrap;-webkit-transform:translate(-50%,-100%);transform:translate(-50%,-100%);cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.4);font-size:.9em;}
#ebub b{display:inline-block;min-width:1.3em;text-align:center;background:#2e1612;color:#fff;border-radius:3px;margin-right:.4em;padding:0 .2em;}
#ebub:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-5px;border:5px solid transparent;border-top-color:#5a2a24;border-bottom:0;}
#padl{display:none;position:absolute;left:calc(var(--u)*1.2);bottom:calc(var(--u)*1);z-index:5;gap:6px;}
#padl button{width:calc(var(--u)*6);height:calc(var(--u)*6);border:2px solid #5a2a24;background:rgba(240,226,188,.85);color:#2e1612;font-weight:bold;font-size:.9em;border-radius:6px;padding:0;}
body.touch #padl{display:-webkit-flex;display:flex;}
#place{left:auto;right:auto;top:auto;bottom:calc(var(--u)*1);left:calc(var(--u)*1.2);background:rgba(36,22,12,.82);color:#f6ecd0;font-size:.8em;border:calc(var(--u)*.3) solid #8a6a3a;}
body.touch #place{bottom:calc(var(--u)*8);}
#kindtag{top:calc(var(--u)*1.2);left:50%;right:auto;-webkit-transform:translateX(-50%);transform:translateX(-50%);font-size:.85em;}
@media (max-width:640px){#hudR{width:calc(var(--u)*20);}#board{display:none;}#hudg{display:none;}#hotbar .sl{width:calc(var(--u)*4.2);height:calc(var(--u)*4.2);}#hudlv{display:none;}#stage{font-size:calc(var(--u)*2.6);}#hudL{min-width:calc(var(--u)*20);}}
/* 對話框：紙卷＋名牌＋立繪 */
#story{background:linear-gradient(180deg,#f2e6c6 0,#e8d8ae 60%,#dccb9c 100%);border:5px solid #7a2a22;box-shadow:0 0 0 2px #d9a93a,0 0 0 4px #0d0907,inset 0 0 0 2px #c8a460,inset 0 0 22px rgba(120,80,30,.25);color:#2e1612;padding:16px 16px 10px;margin-top:10px;}
#story:before,#story:after{content:"❀";position:absolute;color:#b8322a;font-size:15px;line-height:1;}
#story:before{left:4px;top:2px;}#story:after{right:4px;bottom:2px;}
#txt .fx{color:#2f6a3a;}#txt .hd{color:#8a2a1e;}#txt .say{color:#6a3410;}#txt .ai{color:#1f5a8a;}#txt .cur{color:#8a2a1e;}
#aitag{color:#1f5a8a;}#skip{color:#7a5a30;}
#spk{position:relative;float:left;display:none;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;margin:0 12px 4px 0;gap:0;width:84px;}
#spk canvas{width:84px;height:84px;border:3px solid #7a2a22;background:#889;box-shadow:0 0 0 2px #d9a93a;}
#spk>div{text-align:center;margin-top:-10px;position:relative;z-index:2;}
#spname{background:linear-gradient(#6a2a1e,#4a1a12);color:#f6e6b4;padding:1px 10px;border:2px solid #d9a93a;font-size:15px;text-shadow:none;letter-spacing:2px;}
#spname:before{content:"";}
#spsub{color:#7a5a30;font-size:11px;}
#story .cur{color:#8a2a1e;}
#place:before{content:"";}
#pbadge{display:none !important;}

/* ===== V5：劇情框大改版（彈性高度、歷史淡化、最新置頂、字級、展開/收起）+ 全面 UI 美化 ===== */
:root{--vh:1vh;--sfs:19px;--wood1:#5a2a24;--wood2:#3a2216;--wood3:#2a170e;--paper1:#f6ecd0;--paper2:#e8d8ae;--paper3:#dac79a;--gold2:#f0cf6a;}
html,body{height:100%;}
body{background:radial-gradient(ellipse at 50% -10%,#3a2a1e 0,#1d1410 55%,#0d0907 100%);}
body:before{content:"";position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:0;background:repeating-linear-gradient(0deg,rgba(255,200,120,.018) 0,rgba(255,200,120,.018) 1px,transparent 1px,transparent 4px);}
#app{height:calc(var(--vh)*100);position:relative;z-index:1;}
/* 頂欄：深木＋金線 */
#top{background:linear-gradient(180deg,#4a2c1c 0,#2e1a10 60%,#24150d 100%);border-bottom:3px solid #0d0907;box-shadow:0 2px 0 #b0623a,0 4px 0 #0d0907,0 6px 10px rgba(0,0,0,.5);padding:6px 8px;}
#tdate{color:var(--gold2);text-shadow:1px 1px 0 #000;letter-spacing:1px;}
#ttitle{text-shadow:1px 1px 0 #000;}
.ib{background:linear-gradient(180deg,#b0623a 0,#5e2420 50%,#432a1a 100%);box-shadow:inset 0 0 0 1px rgba(240,207,106,.35),inset -2px -2px 0 #24160c,inset 2px 2px 0 #a8744a,0 2px 0 #0d0907;min-width:38px;height:36px;transition:-webkit-transform .08s;transition:transform .08s;}
.ib:active{-webkit-transform:translateY(2px);transform:translateY(2px);box-shadow:inset 0 0 0 1px rgba(240,207,106,.35),inset 2px 2px 0 #24160c;}
/* 舞台：雕花木框＋暗角 */
#stagewrap{background:linear-gradient(180deg,#0d0907,#1a110c);border-bottom:0;box-shadow:none;padding:8px 8px 0;}
#stage{max-width:calc(var(--vh)*42*1.7778);box-shadow:0 0 0 3px #0d0907,0 0 0 6px #b0623a,0 0 0 8px #d9a93a,0 0 0 10px #0d0907,0 8px 18px 6px rgba(0,0,0,.6);background:#0d0907;}
body.sx #stage{max-width:calc(var(--vh)*19*1.7778);}
#stage:after{content:"";position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:2;box-shadow:inset 0 0 36px rgba(0,0,0,.5),inset 0 0 0 1px rgba(240,207,106,.25);background:linear-gradient(180deg,rgba(255,235,190,.07) 0,rgba(255,235,190,0) 28%,rgba(10,6,4,0) 70%,rgba(10,6,4,.28) 100%);}
#stage{z-index:1}
#cv{-webkit-transition:opacity .3s;transition:opacity .3s;}
#place{background:linear-gradient(180deg,rgba(74,30,22,.92),rgba(36,15,10,.92));border:2px solid var(--gold2);color:#f9eccb;text-shadow:1px 1px 0 #000;box-shadow:0 2px 4px rgba(0,0,0,.5);z-index:3;}
#kindtag{z-index:3;background:linear-gradient(180deg,#b8322a,#7a1e18);border:2px solid var(--gold2);box-shadow:0 2px 4px rgba(0,0,0,.5);text-shadow:1px 1px 0 #000;}
/* 劇情框：捲軸紙 */
#story{position:relative;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-flex:1 1 0;flex:1 1 0;min-height:calc(var(--vh)*35);overflow:hidden;margin:12px 10px 0;padding:0;
 background:repeating-linear-gradient(0deg,rgba(120,80,30,.05) 0,rgba(120,80,30,.05) 1px,transparent 1px,transparent 4px),linear-gradient(180deg,var(--paper1) 0,var(--paper2) 55%,var(--paper3) 100%);
 border:4px solid var(--wood1);border-radius:0;color:#2e2012;
 box-shadow:0 0 0 2px var(--gold),0 0 0 4px #0d0907,0 8px 16px rgba(0,0,0,.55),inset 0 0 0 2px #c8a460,inset 0 0 30px rgba(120,80,30,.30);}
#story:before{content:"";position:absolute;left:0;right:0;top:0;height:6px;z-index:3;background:linear-gradient(180deg,#a8744a,#7a2a22 60%,#3a2216);pointer-events:none;}
#story:after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;z-index:3;background:linear-gradient(180deg,#7a2a22,#a8744a 40%,#3a2216);pointer-events:none;font-size:0;color:transparent;right:0;}
#sscroll{-webkit-flex:1;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 20px;overscroll-behavior:contain;position:relative;}
#sscroll::-webkit-scrollbar{width:6px;}
#sscroll::-webkit-scrollbar-thumb{background:#b0623a;border-radius:3px;}
#sscroll::-webkit-scrollbar-track{background:rgba(90,58,34,.12);}
#hist{display:none;}
#hist .he{font-size:calc(var(--sfs)*.82);line-height:1.6;opacity:.48;color:#5a4630;padding:0 0 7px;margin:0 0 8px;border-bottom:1px dashed rgba(90,58,34,.4);white-space:pre-wrap;word-break:break-word;}
#hist .he b{color:#7a2a1e;margin-right:.5em;}
#hist .he b:after{content:"：";}
#hist .he .fx,#hist .he .hd,#hist .he .say,#hist .he .ai{color:inherit;}
#cur{position:relative;padding:4px 4px 4px 12px;margin-left:-4px;border-left:4px solid #b8322a;background:linear-gradient(90deg,rgba(255,252,232,.6),rgba(255,252,232,0) 85%);}
#cur:after{content:"";display:block;clear:both;}
#txt{font-size:var(--sfs);line-height:1.85;color:#2a1c10;text-shadow:0 1px 0 rgba(255,255,255,.35);letter-spacing:.3px;}
#txt .fx{font-size:.9em;}
#txt .hd{font-size:1.02em;}
#more{display:none;position:absolute;left:4px;right:4px;bottom:6px;height:30px;line-height:36px;text-align:center;font-size:15px;color:#8a2a1e;pointer-events:none;z-index:2;background:linear-gradient(180deg,rgba(226,208,162,0),rgba(226,208,162,.96) 70%);-webkit-animation:bob 1s ease-in-out infinite;animation:bob 1s ease-in-out infinite;}
@-webkit-keyframes bob{50%{-webkit-transform:translateY(3px)}}@keyframes bob{50%{transform:translateY(3px)}}
#sexp{position:absolute;right:8px;top:9px;z-index:4;height:26px;padding:0 9px;font-size:12px;color:#f6e6b4;border:0;cursor:pointer;background:linear-gradient(180deg,#8a3a26,#5a2418);box-shadow:inset 0 0 0 1px rgba(240,207,106,.5),0 2px 0 #0d0907;border-radius:0;opacity:.92;}
#sexp:active{-webkit-transform:translateY(2px);transform:translateY(2px);}
#skip{right:12px;bottom:10px;z-index:4;font-size:12px;color:#6a4a20;background:rgba(246,236,208,.92);padding:2px 8px;border:1px solid #b8985a;-webkit-animation:bob 1s ease-in-out infinite;animation:bob 1s ease-in-out infinite;}
#spk{margin:0 14px 6px 0;}
#spk canvas{width:88px;height:88px;border:3px solid var(--wood1);box-shadow:0 0 0 2px var(--gold),0 0 0 4px #0d0907,0 4px 8px rgba(0,0,0,.45);background:linear-gradient(180deg,#8a98b8,#556);}
#spname{background:linear-gradient(180deg,#8a2a1e,#4a1a12);border:2px solid var(--gold2);color:#fbeed0;font-size:15px;text-shadow:1px 1px 0 #000;box-shadow:0 2px 3px rgba(0,0,0,.45);}
#spsub{color:#7a5a30;}
body.sx #stagewrap{padding-top:5px;}
/* 選項區 */
#bottom{-webkit-flex:0 1 auto;flex:0 1 auto;min-height:calc(var(--vh)*13);max-height:calc(var(--vh)*34);padding:10px 10px 4px;overscroll-behavior:contain;}
#choices{gap:8px;}
#choices.two{grid-template-columns:1fr 1fr;}
.cbtn{min-height:46px;padding:10px 12px;font-size:calc(var(--fs) + 0px);line-height:1.4;
 background:linear-gradient(180deg,#86402a 0,#5e281c 50%,#4a1f16 100%);
 box-shadow:inset 0 0 0 1px rgba(240,207,106,.4),inset 0 2px 0 rgba(255,220,170,.22),inset -3px -3px 0 #2a0f0a,inset 3px 3px 0 #a8603f,0 3px 0 #0d0907,0 5px 8px rgba(0,0,0,.45);
 -webkit-transition:-webkit-transform .08s;transition:transform .08s;}
.cbtn:active{-webkit-transform:translateY(3px);transform:translateY(3px);box-shadow:inset 0 0 0 1px rgba(240,207,106,.4),inset -3px -3px 0 #a8603f,inset 3px 3px 0 #2a0f0a,0 0 0 #0d0907;}
.cbtn.ai{background:linear-gradient(180deg,#2a5a74,#1c3a4e 55%,#142c3c);box-shadow:inset 0 0 0 1px rgba(143,211,255,.45),inset -3px -3px 0 #0c1c26,inset 3px 3px 0 #4a8aaa,0 3px 0 #0d0907,0 5px 8px rgba(0,0,0,.45);}
.cbtn.back{background:linear-gradient(180deg,#4a4a56,#32323a 55%,#26262c);box-shadow:inset 0 0 0 1px rgba(200,200,220,.28),inset -3px -3px 0 #141418,inset 3px 3px 0 #6a6a78,0 3px 0 #0d0907,0 5px 8px rgba(0,0,0,.45);}
.glab{font-size:13px;color:var(--gold2);text-shadow:1px 1px 0 #000;margin-top:4px;padding:1px 0 1px 8px;border-left:4px solid var(--red);background:linear-gradient(90deg,rgba(184,50,42,.28),rgba(184,50,42,0));}
/* 輸入列 */

/* 彈窗、面板 */
.ov{background:rgba(8,5,3,.84);}
.box{background:repeating-linear-gradient(0deg,rgba(255,200,120,.02) 0,rgba(255,200,120,.02) 1px,transparent 1px,transparent 4px),linear-gradient(180deg,#32231a,#221710);border:4px solid var(--wood1);box-shadow:0 0 0 2px var(--gold),0 0 0 4px #0d0907,0 12px 30px rgba(0,0,0,.7),inset 0 0 0 2px #0d0907;}

.hbar{background:#2a1c10;border:1px solid #1a0f08;box-shadow:inset 0 1px 2px rgba(0,0,0,.7);}
.hbar i{box-shadow:inset 0 1px 0 rgba(255,255,255,.45);-webkit-transition:width .4s;transition:width .4s;}

#hotbar .sl{background:linear-gradient(180deg,#d8c698,#efe2b8);border:2px solid #8a6a3a;box-shadow:inset 0 2px 3px rgba(90,58,34,.45),0 1px 0 rgba(255,255,255,.4);}

#hotbar .sl canvas{-webkit-filter:drop-shadow(1px 2px 0 rgba(60,36,16,.4));filter:drop-shadow(1px 2px 0 rgba(60,36,16,.4));}

var AI_CLAMP={st:8,gold:300,hp:25,rel:15,days:45,fac:5,sus:30};
function applyFx(fx,src){
 if(!fx)return[];
 var out=[];var ai=(src==='ai');
 var st=fx.st;
 if(st){for(var k in st){if(S.p.st[k]===undefined)continue;var d=+st[k];if(isNaN(d))continue;
   if(ai){var lim=(k==='gold')?AI_CLAMP.gold:(k==='hp'?AI_CLAMP.hp:AI_CLAMP.st);d=clamp(d,-lim,lim);}
   if(d<0&&k==='hp'){d=Math.round(d*({easy:0.2,normal:0.85,hard:1.1,hell:1.4}[SET.diff]||1)*(window.dmgMul?dmgMul():1));if(d===0)d=-1;}
   var cap=(k==='gold')?999999:(k==='merit'?999:100);
   if(k==='wu'||k==='zhi'||k==='zheng'||k==='mei'||k==='tong'||k==='stealth'){cap=(k==='wu'&&S.flags.kh_done)?100:95;}
   var old=S.p.st[k];S.p.st[k]=clamp(Math.round(old+d),0,cap);var ch=S.p.st[k]-old;
   if(ch!==0&&k!=='merit')out.push(ST_NAMES[k]+(ch>0?'+':'')+ch);else if(ch!==0)out.push('功勳'+(ch>0?'+':'')+ch);}}
 if(fx.rel){for(var id in fx.rel){if(!NPC[id])continue;var o=fx.rel[id];for(var dm in o){if(REL_KEYS.indexOf(dm)<0)continue;var dd=+o[dm];if(isNaN(dd))continue;if(ai)dd=clamp(dd,-AI_CLAMP.rel,AI_CLAMP.rel);
   addRel(id,dm,dd);var rn=REL_DIMS[REL_KEYS.indexOf(dm)][1];out.push(nm(id)+rn+(dd>0?'+':'')+dd);}
   R(id).met=R(id).met||1;}}
 if(fx.mem){for(id in fx.mem){if(NPC[id])addMem(id,String(fx.mem[id]).slice(0,60));}}
 if(fx.sus){for(var i=0;i<fx.sus.length;i++){var sx=fx.sus[i];if(!NPC[sx[0]]||!NPC[sx[1]])continue;var sd=+sx[2];if(ai)sd=clamp(sd,-AI_CLAMP.sus,AI_CLAMP.sus);nrSus(sx[0],sx[1],sd);out.push(nm(sx[0])+'對'+nm(sx[1])+'的懷疑'+(sd>0?'+':'')+sd);}}
 if(fx.bond){for(i=0;i<fx.bond.length;i++){var bx=fx.bond[i];nrBond(bx[0],bx[1],+bx[2]);}}
 if(fx.flags){for(var f in fx.flags){var key=ai?'ai_'+f.replace(/[^\w]/g,''):f;S.flags[key]=fx.flags[f];}}
 if(fx.fac){for(f in fx.fac){if(!S.fac[f])continue;var fd=+fx.fac[f];if(ai)fd=clamp(fd,-AI_CLAMP.fac,AI_CLAMP.fac);S.fac[f].pw=clamp(S.fac[f].pw+fd,0,100);}}
 if(fx.item){for(var it in fx.item){if(!ITEMS[it])continue;S.p.items[it]=Math.max(0,(S.p.items[it]||0)+fx.item[it]);out.push(ITEMS[it].n+(fx.item[it]>0?'+':'')+fx.item[it]);}}
 if(fx.bounty){S.p.wanted=clamp(S.p.wanted+fx.bounty,0,100);if(fx.bounty>0)out.push('通緝度+'+fx.bounty);}
 if(fx.kh){S.p.kh=clamp(S.p.kh+fx.kh,0,100);}
 if(fx.q&&!ai){addQuest(fx.q);}
 if(fx.qdone)questState(fx.qdone,'done');
 if(fx.qfail)questState(fx.qfail,'fail');
 if(fx.news)addNews(fx.news);
 if(fx.log)addLog(fx.log);
 if(fx.npc&&!ai){for(id in fx.npc){if(S.npc[id])for(var kk in fx.npc[id])S.npc[id][kk]=fx.npc[id][kk];}}
 if(fx.loc&&REGIONS[fx.loc]){S.p.region=fx.loc;if(REGIONS[fx.loc].sub.indexOf(S.p.spot)<0)S.p.spot=REGIONS[fx.loc].sub[0];}
 if(fx.spot&&THEMES[fx.spot])S.p.spot=fx.spot;
 if(fx.assist){for(f in fx.assist){S.assist[f]=(S.assist[f]||0)+fx.assist[f];}}
 if(fx.kill&&!ai){killNpc(fx.kill,fx.cause||'身亡',fx.killer||null);}
 if(fx.days){var dy=+fx.days;if(ai)dy=clamp(dy,0,AI_CLAMP.days);if(dy>0)advance(dy);}
 return out;
}

function addQuest(q){
 for(var i=0;i<S.quests.length;i++){if(S.quests[i].id===q.id){if(S.quests[i].s==='active'){S.quests[i].d=q.d||S.quests[i].d;return;}}}
 S.quests.push({id:q.id,t:q.t,d:q.d||'',s:'active',day:S.day,type:q.type||'',a:q.a||null,due:q.due||0,rew:q.rew||null,giver:q.giver||''});
}
function questState(id,s){for(var i=0;i<S.quests.length;i++){var q=S.quests[i];if(q.id===id&&q.s==='active'){q.s=s;q.end=S.day;addLog('任務「'+q.t+'」'+(s==='done'?'完成':'失敗'));
 if(s==='done'&&q.rew){applyFx(q.rew);}}}}
function hasQuest(id){for(var i=0;i<S.quests.length;i++)if(S.quests[i].id===id)return S.quests[i].s;return '';}
function checkQuests(){
 for(var i=0;i<S.quests.length;i++){var q=S.quests[i];if(q.s!=='active'||!q.type)continue;
  if(q.type==='kill'&&!alive(q.a.t)){questState(q.id,(S.flags['killed_by_p_'+q.a.t])?'done':'fail');}
  else if(q.type==='sus'&&NR(q.a.a,q.a.b).su>=q.a.v){questState(q.id,'done');}

  else if(q.due&&S.day>q.due){questState(q.id,'fail');}}

 for(var i=0;i<days;i++){S.day++;S.stat.days++;
  if(S.day%4===0){var h=S.p.st.hp;if(h<100&&h>0){S.p.st.hp=Math.min(100,h+(S.flags.resting?3:1)+(window.hpRegen?hpRegen():0));}}
  if(window.dayHook)dayHook();

 runQueue();

 var guard=0;
 while(S.queue.length&&S.queue[0].due<=S.day&&guard++<60){
  var e=S.queue.shift();var h=QH[e.id];if(h){var sc=null;try{sc=h(e.a||{});}catch(err){if(window.console)console.error('queue handler',e.id,err);}if(sc)S.pending.push(sc);}}

 pp.wanted=Math.max(0,pp.wanted-2);
 // 威權：計算權勢

 for(var i=0;i<keys.length;i++){var ab=keys[i].split('>');var a=ab[0],b=ab[1];if(!alive(a)||!alive(b))continue;

function resolveRift(a,b){

 var a_ruler=(S.fac[fa]&&S.fac[fa].ruler===a),b_ruler=(S.fac[fb]&&S.fac[fb].ruler===b);

 if(fa===fb&&fa!=='none'){
  if(b_ruler&&!a_ruler){ // 下克上

   if(roll(25+pwr*0.5)){txt=na.n+'因疑忌日深，趁機對'+nb.n+'下手，'+nb.n+'竟死於'+na.n+'之手！';killNpc(b,'為'+na.n+'所殺',a);addNews(txt);return;}
   else{txt=na.n+'謀害'+nb.n+'未遂，連夜出逃，投奔他處。';defect(a);addNews(txt);return;}

   txt=nb.n+'察覺'+na.n+'疑忌，棄官而去。';defect(b);addNews(txt);return;

function killNpc(id,cause,killer,silent){
 if(!alive(id))return;
 var o=S.npc[id];o.a=0;S.dead.push({id:id,day:S.day,cause:cause,by:killer||''});
 var n=NPC[id];S.flags['dead_'+id]=1;
 if(killer==='player'){S.flags['killed_by_p_'+id]=1;}

 addLog(n.n+'：'+cause);
 // 勢力影響
 if(S.fac[fid]&&fid!=='none'){S.fac[fid].pw=clamp(S.fac[fid].pw-(n.tier>=4?6:(n.tier===3?2.5:1)),0,100);}
 // 大王
 if(S.emp===id){nextEmperor();}
 // 繼任
 if(S.fac[fid]&&S.fac[fid].ruler===id&&fid!=='qin'&&fid!=='lv'){succession(fid,id);}
 if(S.reg===id){S.reg=regentGuess();}
 // 友人之恨
 for(var i=0;i<NPCS.length;i++){var m=NPCS[i];if(!alive(m.id)||m.id===id)continue;var b=NR(m.id,id).b;
  if(b>=50&&killer&&killer!=='player'&&alive(killer)){nrSus(m.id,killer,25);NR(m.id,killer).b-=30;}}
 if(killer==='player'&&!silent){S.stat.kills++;
  // 世人是否知曉
  var known=roll(25+(S.p.wanted>0?10:0)-S.p.st.stealth*0.2);
  for(i=0;i<NPCS.length;i++){m=NPCS[i];if(!alive(m.id))continue;var bd=NR(m.id,id).b;
   if(bd>=40){if(known||m.id===id){addRel(m.id,'ha',Math.round(bd*0.6));addRel(m.id,'su',20);addMem(m.id,'聽說'+S.p.name+'與'+n.n+'之死有關。');}else{addRel(m.id,'su',6);}}
   else if(bd<=-40&&known){addRel(m.id,'tr',8);addRel(m.id,'re',8);}}
  S.p.wanted=clamp(S.p.wanted+(known?n.tier*12:n.tier*4),0,100);
  S.flags.known_killer_p=S.flags.known_killer_p||known;
  S.p.st.rep=clamp(S.p.st.rep+(known?n.tier*2:0),0,100);}
 if(!silent&&killer!=='player')S.news.push({d:S.day,t:n.n+'：'+cause});
 return true;
}

 var n=NPC[id];var same=(facOf(id)===S.p.fac&&S.p.fac!=='none');var r=R(id);
 var st=S.p.rank*1.0+S.p.st.rep/18+(same?1.5:0)+r.tr/25+(r.met?0.8:0)+(n.fic?3:0)+(n.tier<=1?3:0)+(S.p.st.inf/30);
 if(id===bossOf())st+=3;
 if(n.hidden)st+=3;
 var need=n.tier*1.15+(n.tier>=4?0.8:0);
 return {ok:st>=need,st:st,need:need};
}

 var path=S.p.path;var fac=S.p.fac;
 if(fac==='none'&&path!=='wander'){path='wander';}
 var pool=DUTY[path]||DUTY.wander;var d=pick(pool);var fx={};var base=d[1];
 var st={};for(var k in base)st[k]=base[k];
 var bonus=Math.round(PATHS[S.p.path].need[Math.min(S.p.rank,4)]*0);
 st.merit=(st.merit||0)+Math.floor(pStat(PATHS[S.p.path].stat)/40);
 var risk='';
 if((path==='soldier'||path==='guard'||path==='wander')&&roll(18)){var dmg=3+rnd(10);st.hp=-dmg;risk='\n途中不慎受傷。';}
 fx.st=st;fx.days=10;
 var b=bossOf();if(b){fx.rel={};fx.rel[b]={tr:1+(rnd(3)),re:1};}
 if(S.fac[fac]&&fac!=='none'){fx.fac={};fx.fac[fac]=0.25;fx.assist={};fx.assist[fac]=1;}
 var out=applyFx(fx);
 S.stat.visits+=0;
 return resultScene('當差·'+PATHS[S.p.path].ranks[Math.min(S.p.rank,4)],d[0]+risk+fxLine(out));
};

NODES.pickNpc=function(a){

 ids.sort(function(x,y){var sx=(locOf(x)===S.p.region?1000:0)+NPC[x].tier*10+NPC[x].fame/10;var sy=(locOf(y)===S.p.region?1000:0)+NPC[y].tier*10+NPC[y].fame/10;return sy-sx;});

 if(pages>1){if(pg>0)c.push(ch('◀ 上一頁','pickNpc',{pu:pu,pg:pg-1,next:next,nx:a.nx,ctx:a.ctx}));if(pg<pages-1)c.push(ch('下一頁 ▶','pickNpc',{pu:pu,pg:pg+1,next:next,nx:a.nx,ctx:a.ctx}));}

function scheduleTimeline(opt){
 if(!isHist())return;
 var st=dayOf(opt.y,opt.m,1);
 var list=TL.slice().sort(function(a,b){var A=parseYM(a.at),B=parseYM(b.at);return (mIdx(A.y,A.m)-mIdx(B.y,B.m))||(a.die?1:0)-(b.die?1:0);});
 for(var i=0;i<list.length;i++){var e=list[i];var t=parseYM(e.at);var due=dayOf(t.y,t.m,e.die?15:1);
  if(due<st){
   if(e.die){var id=e.who;if(S.npc[id]&&S.npc[id].a===1){dieNow(id,true);}}
   else if(!e.cond||e.cond()){try{e.run(true);}catch(er){}}
  } else {
   if(e.die)S.queue.push({due:due,id:'die',a:{k:e.who}});
   else S.queue.push({due:due,id:'hist',a:{k:e.id}});
  }}
 S.queue.sort(function(a,b){return a.due-b.due;});
}
QH.hist=function(a){
 var e=TLM[a.k];if(!e)return null;if(e.cond&&!e.cond())return null;
 var t=e.run?e.run(false):'';if(t)addNews(t);
 var sc=e.sc?e.sc():null;
 if(sc)return sc;
 if(e.big&&t)return histBig(t,e.bgm||'palace');
 return null;
};

var ENDING_FATAL={executed:1,die_prison:1,die_hp:1};
function checkEnding(){
 if(S.p.st.hp<=0)return endingScene('die_hp');
 var E=S.endings;var p=S.p;var pass=function(x){return E.indexOf(x)<0;};
 if(p.rank>=4){
  if(p.path==='soldier'&&pass('peak_general')&&(window.jueLv?jueLv()>=12:true))return endingScene('peak_general');
  if((p.path==='adviser'||p.path==='guard')&&pass('peak_court'))return endingScene('peak_court');
  if((p.path==='eunuch'||p.path==='maid'||p.path==='consort')&&pass('peak_harem'))return endingScene('peak_harem');
  if((p.path==='wander'||p.path==='attendant'||p.path==='physician')&&pass('peak_jianghu'))return endingScene('peak_jianghu');
 }
 if(pass('revenge_done')&&S.rv&&S.rv.done)return endingScene('revenge_done');
 return null;
}
function epilogue(){
 var l=[];var tops=[];for(var id in S.rel){if(!alive(id))continue;var r=S.rel[id];tops.push([id,r.tr+r.af+r.lo+r.ly-r.ha]);}tops.sort(function(a,b){return b[1]-a[1];});
 l.push('——人生回顧——');
 l.push(S.p.name+'，'+(S.p.gender==='f'?'女':'男')+'，最終身分：'+S.p.title+'。');
 l.push('歷時 '+Math.floor(S.stat.days/30)+' 個月，經歷 '+S.stat.kills+' 場刺殺、'+S.stat.schemes+' 次計謀、'+S.stat.letters+' 封密信。');
 if(tops.length&&tops[0][1]>40)l.push('最掛念你的人：'+nm(tops[0][0])+'（'+relLabel(tops[0][0])+'）。');
 l.push('天下形勢：'+FAC_ORDER.filter(function(f){return S.fac[f].on;}).sort(function(a,b){return S.fac[b].pw-S.fac[a].pw;}).slice(0,3).map(function(f){return FACTIONS[f].n+'('+Math.round(S.fac[f].pw)+')';}).join('、')+'。');
 return l.join('\n');
}

 c.push(ch('📂 讀取存檔','ui',{u:'save'}));

function visitReasons(id){
 var n=NPC[id],r=R(id);var res=[];
 if(n.child||id===S.emp)return res;
 if(r.ha>=55)res.push(['threat',34]);
 if(r.lo>=55&&likes(id,pgOf())&&!(n.ro&&!n.ro.length))res.push(['love',30]);
 if(r.af>=55&&r.tr>=40)res.push(['friend',24]);
 if(r.su>=45&&r.ha<55)res.push(['test',24]);
 if(facOf(id)!==S.p.fac&&facOf(id)!=='none'&&S.p.st.rep>=25&&r.re>=25&&n.tier>=2&&r.ha<40)res.push(['recruit',12]);
 if(r.tr>=35&&n.tier>=2&&n.tier<=3)res.push(['favor',13]);
 if(r.tr>=50&&n.amb>=60&&n.tier>=2)res.push(['plot',13]);
 if(S.p.wanted>=30&&r.af>=45)res.push(['warn',18]);
 if(id===bossOf()&&S.p.st.merit>=15)res.push(['reward',9]);
 return res;
}
function visitCandidates(){

 for(var i=0;i<here.length;i++){var id=here[i];var r=S.rel[id];if(!r||!r.met)continue;if(S.day-(r.vis||-999)<45)continue;

 return cand;
}

 if(SET.ai&&SET.aiMode==='full'&&AI.ready()&&S.turn%Math.max(1,SET.aiRate)===0)pool.push({k:'ai',d:null,w:25});
 if(!pool.length)return null;
 var tot=0;for(i=0;i<pool.length;i++)tot+=pool[i].w;var r=rand()*tot;var sel=pool[0];
 for(i=0;i<pool.length;i++){r-=pool[i].w;if(r<=0){sel=pool[i];break;}}
 if(sel.k==='v')return visitScene(sel.d.id,sel.d.r);
 if(sel.k==='e')return reScene(sel.d);
 if(sel.k==='q')return sel.d.s();
 if(sel.k==='ai')return aiGenScene();
 return null;
}

var AI={busy:null};

 try{var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;SND.ctx=new AC();SND.master=SND.ctx.createGain();SND.master.gain.value=0.5;SND.master.connect(SND.ctx.destination);SND.ok=true;
  if(SND.ctx.state==='suspended'){SND.res();}
  // iOS 解鎖：播放一個靜音緩衝
  try{var b=SND.ctx.createBuffer(1,1,22050);var s=SND.ctx.createBufferSource();s.buffer=b;s.connect(SND.ctx.destination);if(s.start)s.start(0);else s.noteOn(0);}catch(e2){}
  return true;}catch(e){SND.ok=false;return false;}
};
SND.vol=function(){if(SND.master)SND.master.gain.value=Math.max(0,Math.min(1,SET.vol));};
SND.tone=function(f,t0,dur,type,gain,slideTo){
 if(!SND.ctx)return;var c=SND.ctx;var o=c.createOscillator();var g=c.createGain();o.type=type||'triangle';o.frequency.setValueAtTime(f,t0);
 if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);
 g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(gain||0.2,t0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
 o.connect(g);g.connect(SND.master);o.start(t0);o.stop(t0+dur+0.05);
};
SND.noise=function(t0,dur,gain,hp){
 if(!SND.ctx)return;var c=SND.ctx;var n=Math.floor(c.sampleRate*dur);var b=c.createBuffer(1,n,c.sampleRate);var d=b.getChannelData(0);for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
 var s=c.createBufferSource();s.buffer=b;var g=c.createGain();g.gain.value=gain||0.2;var f=c.createBiquadFilter();f.type='highpass';f.frequency.value=hp||1500;s.connect(f);f.connect(g);g.connect(SND.master);s.start(t0);
};
SND.sfx=function(k){
 if(!SET.sfx||!SND.ctx||SND.ctx.state==='suspended')return;SND.vol();var t=SND.ctx.currentTime+0.01;
 try{
 if(k==='click'){SND.tone(660,t,0.07,'square',0.08);}
 else if(k==='ok'){SND.tone(523,t,0.12,'triangle',0.2);SND.tone(784,t+0.1,0.2,'triangle',0.2);}
 else if(k==='bad'){SND.tone(220,t,0.2,'sawtooth',0.12,110);SND.tone(165,t+0.15,0.3,'sawtooth',0.1,80);}
 else if(k==='coin'){SND.tone(988,t,0.08,'square',0.1);SND.tone(1319,t+0.08,0.2,'square',0.1);}
 else if(k==='sword'){SND.noise(t,0.18,0.3,2500);SND.tone(1800,t,0.15,'sawtooth',0.05,600);}
 else if(k==='alert'){SND.tone(440,t,0.12,'square',0.1);SND.tone(330,t+0.14,0.12,'square',0.1);SND.tone(440,t+0.28,0.16,'square',0.1);}
 else if(k==='page'){SND.noise(t,0.08,0.08,3500);}
 else if(k==='gong'){SND.tone(110,t,1.6,'sine',0.35);SND.tone(165,t,1.2,'sine',0.15);}
 else if(k==='type'){SND.tone(900,t,0.02,'square',0.015);}
 }catch(e){}
};
var BGM_SCALE=[0,2,4,7,9]; // 宮商角徵羽
SND.note=function(i){var oct=Math.floor(i/5),d=((i%5)+5)%5;var semis=BGM_SCALE[d]+12*oct;return 220*Math.pow(2,semis/12);};
SND.bgmStart=function(){
 if(SND.bgmTimer||!SND.ctx)return;SND.bgmOn=true;SND.vol();
 var pat=[0,2,4,3,2,1,0,-1],pos=0,mel=5;
 var tick=function(){
  if(!SND.bgmOn||!SET.bgm||!SND.ctx){SND.bgmStop();return;}
  if(SND.ctx.state==='suspended'){SND.bgmTimer=setTimeout(tick,1000);return;}
  var t=SND.ctx.currentTime+0.05;
  if(pos%8===0){SND.tone(SND.note(-5),t,3.2,'sine',0.10);SND.tone(SND.note(-5)*1.5,t,3.0,'sine',0.04);}
  var r=Math.random();
  if(r<0.72){var step=Math.floor(Math.random()*5)-2;mel=Math.max(0,Math.min(11,mel+step));
   SND.tone(SND.note(mel),t,0.9,'triangle',0.09);if(Math.random()<0.3)SND.tone(SND.note(mel+5),t+0.02,0.5,'sine',0.03);}
  pos++;
  SND.bgmTimer=setTimeout(tick,pos%4===0?800:480);
 };
 tick();
};
SND.bgmStop=function(){SND.bgmOn=false;if(SND.bgmTimer){clearTimeout(SND.bgmTimer);SND.bgmTimer=null;}};
SND.apply=function(){SND.vol();if(SET.bgm&&SND.ctx)SND.bgmStart();else SND.bgmStop();};

function panelAct(act,el){
 if(act==='close')closeModal();

}

function manualAct(act){
 var o=UIs.xcur;if(!o)return;var msg=$('xmsg');
 if(act==='copy'){copyText($('xprompt'),function(ok){msg.className=ok?'hint':'fwarn';msg.textContent=ok?'✅ 已複製！請打開 Grok 貼上並送出。':'無法自動複製，請長按提示文字→全選→拷貝。';});}
 else if(act==='paste'){
  try{if(navigator.clipboard&&navigator.clipboard.readText){navigator.clipboard.readText().then(function(t){$('xreply').value=t;msg.className='hint';msg.textContent='已貼上，請按「套用」。';},function(){msg.className='fwarn';msg.textContent='瀏覽器不允許讀取剪貼簿，請長按輸入框手動貼上。';});return;}}catch(e){}
  msg.className='fwarn';msg.textContent='請長按下方輸入框手動貼上。';
 }
 else if(act==='apply'){
  var t=$('xreply').value;if(!t.replace(/\s/g,'')){msg.className='fwarn';msg.textContent='請先貼上 Grok 的回覆。';return;}
  var r=null;
  try{r=AI.parseReply(t,o.need);}catch(e){
   UIs.xbad++;msg.className='fwarn';
   msg.textContent=(e&&e.kind==='schema'?'解析到 JSON，但缺少 scene 或至少 2 個 choices。':'在回覆中找不到有效的 JSON。')+'可請 Grok 重新輸出，或按「關閉」直接用離線劇情。（第 '+UIs.xbad+' 次失敗）';return;}
  UIs.xcur=null;hideX();SND.sfx('ok');o.resolve(r);
 }
 else if(act==='offline'){
  UIs.xcur=null;hideX();
  var cb=UIs.offlineCb;
  try{o.reject({kind:'cancel'});}catch(e){}
  if(cb)cb();
 }
}

/* ===== 支線任務系統 ===== */
var SQ={},SQL=[];
function O(l,s,b,ot,of,ft,ff){return {l:l,s:s,b:b,ot:ot,of:of||{},ft:ft||'',ff:ff||{}};}
function ST(t,o,gap){return {t:t,o:o,gap:gap||16};}
function Q(id,k,n,d,when,steps,fin,who){var q={id:id,k:k,n:n,d:d,when:when,steps:steps,fin:fin,who:who||null};SQ[id]=q;SQL.push(q);}
function sqState(id){return X().sq[id]||null;}
function sqStage(id){var s=sqState(id);return s?s.s:0;}
function sqActive(){var n=0;for(var i=0;i<SQL.length;i++){var s=sqState(SQL[i].id);if(s&&s.st==='active')n++;}return n;}
function sqDoneCount(k){var n=0;for(var i=0;i<SQL.length;i++){var s=sqState(SQL[i].id);if(s&&s.st==='done'&&(!k||SQL[i].k===k))n++;}return n;}
function sqReady(){var r=[];for(var i=0;i<SQL.length;i++){var s=sqState(SQL[i].id);if(s&&s.st==='active'&&s.due<=S.day)r.push(SQL[i]);}return r;}
function sqAvail(){var r=[];for(var i=0;i<SQL.length;i++){var q=SQL[i];if(sqState(q.id))continue;var ok=false;try{ok=q.when();}catch(e){ok=false;}if(ok)r.push(q);}return r;}
function sqTxt(q,t){var s=sqState(q.id);var W=s&&s.w?nm(s.w):'';return String(t).replace(/\{W\}/g,W).replace(/\{T\}/g,W).replace(/\{P\}/g,S.p.name);}
function sqFx(fx){
 if(!fx)return {};var o={};for(var k in fx)o[k]=fx[k];
 if(o.eq){if(EQ[o.eq])eqGive(o.eq);delete o.eq;}
 if(o.book){X().misc['own_'+o.book]=1;delete o.book;}
 if(o.sp){X().bonusSp=(X().bonusSp||0)+o.sp;delete o.sp;}
 if(o.ally){X().allies[o.ally]=1;delete o.ally;}
 return o;
}

 var n=Math.min(4,av.length);var start=av.length?(S.day%av.length):0;var shown=[];
 for(var i=0;i<n;i++){var q=av[(start+i)%av.length];shown.push(q);}

 if(!shown.length)t+='眼下沒有適合你的告示，過些時日再來看看吧。';
 if(lim<=0)t+='\n（你手頭已有三件事在辦，再多恐怕忙不過來。）';
 for(i=0;i<shown.length;i++){var qq=shown[i];t+='\n・【'+({love:'情',revenge:'仇',court:'宮',jianghu:'江湖',faction:'勢力',person:'人物'}[qq.k]||'事')+'】'+qq.n+'：'+qq.d;
  if(lim>0)c.push(ch('接下：'+qq.n,'sqStart',{id:qq.id}));}
 c.push(plain('↩ 返回','hub'));
 return scene(t,'',{kind:'menu',bg:S.p.spot,ch:c});
};

 var w=q.who?q.who():'';

 addQuest({id:'sq_'+q.id,t:q.n,d:sqTxt(q,q.d)});

 return PL('接下任務','你記下了這件事：「'+q.n+'」。\n'+sqTxt(q,q.d)+'\n\n過些時日，事情自會有進展。（屆時主選單會出現「支線」選項。）',null);

 var q=SQ[a.id];var s=sqState(q.id);if(!s||s.st!=='active')return NODES.hub();
 var stp=q.steps[s.s];var c=[];
 for(var i=0;i<stp.o.length;i++){var o=stp.o[i];c.push(ch(sqTxt(q,o.l),'sqRes',{id:q.id,i:i}));}
 return scene('【'+q.n+'·第'+(s.s+1)+'章】\n'+sqTxt(q,stp.t),s.w||'',{kind:'event',bg:S.p.spot,ch:c});

NODES.sqRes=function(a){
 var q=SQ[a.id];var s=sqState(q.id);var stp=q.steps[s.s];var o=stp.o[a.i];
 var pass=true;if(o.s){var v=pStat(o.s);pass=rollD(o.b+v*0.5);}else if(o.b){pass=rollD(o.b);}
 var txt=pass?o.ot:o.ft;var fx=sqFx(pass?o.of:o.ff);var failQ=!!(fx.fail);delete fx.fail;
 var out=applyFx(fx);txt=sqTxt(q,txt);
 s.s++;s.due=S.day+(stp.gap||16);
 var fin='';
 if(failQ){s.st='fail';questState('sq_'+q.id,'fail');fin='\n\n〔這件事就此不了了之。〕';}
 else if(s.s>=q.steps.length){
  s.st='done';var ff=sqFx(q.fin.fx);var o2=applyFx(ff);questState('sq_'+q.id,'done');cnt('sqdone');
  fin='\n\n★ 任務完成：「'+q.n+'」\n'+sqTxt(q,q.fin.t)+fxLine(o2);
  if(q.fin.flag)S.flags[q.fin.flag]=1;
  if(q.fin.love&&s.w){S.flags['lover_'+s.w]=1;}
  if(q.fin.wed)S.flags.wed=s.w||1;
  if(q.fin.flagAvenge)S.flags.avenged=1;
  if(q.fin.puppet)S.flags.puppet=1;
  addLog('完成支線「'+q.n+'」。');
 }
 if(S.p.st.hp<=0)return endingScene('die_hp');
 return resultScene(q.n,txt+fxLine(out)+fin,s.w&&NPC[s.w]?s.w:'',S.p.spot);
};

NODES.bag=function(){
 var x=X();var t='【行囊·裝備】\n';
 t+='兵器：'+eqName(x.eq.w)+'　衣甲：'+eqName(x.eq.r)+'　飾物：'+eqName(x.eq.a)+'\n';
 t+='裝備加成：';var bs=[];var ks=['wu','zhi','zheng','mei','tong','stealth'];for(var i=0;i<ks.length;i++){var v=eqBonus(ks[i]);if(v)bs.push(ST_NAMES[ks[i]]+'+'+v);}
 t+=(bs.length?bs.join(' '):'無')+(dmgMul()<1?'　受傷×'+dmgMul().toFixed(2):'')+'\n';
 var its=invList();t+='物品：'+(its.length?its.map(function(k){return ITEMS[k].n+'×'+itemCount(k);}).join('、'):'（空）')+'\n';
 var bk=[];for(var b in x.misc){if(b.indexOf('own_')===0&&!x.read[b.slice(4)]&&BOOKS[b.slice(4)])bk.push(BOOKS[b.slice(4)].n);}
 if(bk.length)t+='未讀之書：'+bk.join('、')+'\n';
 var c=[];
 var us=['medicine','bigmed','antidote','elixir'];
 for(i=0;i<us.length;i++){if(itemCount(us[i])>0)c.push(ch('使用'+ITEMS[us[i]].n+'（×'+itemCount(us[i])+'）：'+ITEMS[us[i]].d,'bagUse',{k:us[i]}));}
 for(var e in x.own){if(!EQ[e])continue;var sl=EQ[e].slot;if(x.eq[sl]===e)c.push(ch('卸下'+EQ[e].n,'equip',{k:e,off:1}));else c.push(ch('裝備'+EQ[e].n+'（'+EQ[e].d+'）','equip',{k:e}));}
 c.push(plain('↩ 返回','hub'));
 return scene(t,'',{kind:'menu',bg:S.p.spot,ch:c});
};
NODES.equip=function(a){

 if(a.off)x.eq[e.slot]='';else x.eq[e.slot]=a.k;
 return NODES.bag();
};

function dtIf(f){if(!f)return null;if(typeof f==='function')return f;return function(){return !!(S.flags[f]||(S.p.items&&S.p.items[f]>0));};}
function DT(id,o){
 o.id=id;DTS[id]=o;DT_ORDER.push(id);
 if(o.npc){(DT_NPC[o.npc]=DT_NPC[o.npc]||[]).push(id);}
 if(o.spot){(DT_SPOT[o.spot]=DT_SPOT[o.spot]||[]).push(id);}
 if(o.enc){DT_ENC.push(id);}
 for(var k in o.n){var nd=o.n[k];var ol=[];
  for(var i=0;nd.o&&i<nd.o.length;i++){var a=nd.o[i];
   if(a instanceof Array){var x=a[4]||{};ol.push({t:a[0],to:a[1]||'',r:a[2]||'',fx:a[3]||null,chk:x.chk||null,ng:x.ng||'',nr:x.nr||'',nfx:x.nfx||null,gold:x.gold||0,iff:dtIf(x['if']),cons:x.cons||''});}
   else ol.push(a);}

function dtDone(id){return !!S.flags['dt_'+id];}

 var tp=DTS[id];if(!tp)return false;

 if(d){if(!tp.rep||S.day-d<tp.rep)return false;}
 if(tp.after){var af=(tp.after instanceof Array)?tp.after:[tp.after];for(var i=0;i<af.length;i++){if(!dtDone(af[i]))return false;}}

NODES.dtPick=function(a){

 else{res=dtTxt(o.nr||'你沒能做到，局面變得有些尷尬。',tp);fx=o.nfx;to=o.ng||o.to;}
 var out=fx?applyFx(fx):[];
 if(o.gold)out.unshift('金錢'+(o.gold>0?'-':'+')+Math.abs(o.gold));
 var cons=(o.chk?(ok?'檢定成功：':'檢定失敗：'):'')+out.join('、');
 dtCons(tp,o,cons||'（無明顯變化）');

 }
 return NODES.dt({id:a.id,k:to,pre:pre});

/* 每日隨機遭遇：每天最多一次，街上、水邊、野外都可能碰上 */
function encPick(){
 var pool=[];var tot=0;
 for(var i=0;i<DT_ENC.length;i++){var id=DT_ENC[i];var tp=DTS[id];
  if(tp.rep===undefined){tp.rep=40;}
  if(!dtAvail(id))continue;
  if(tp.at&&tp.at.indexOf(S.p.spot)<0)continue;
  if(tp.night===1&&!isNight())continue;
  if(tp.night===-1&&isNight())continue;
  if(tp.season&&tp.season!==seasonOf())continue;
  var w=tp.w||5;pool.push([id,w]);tot+=w;}
 if(!pool.length)return null;
 var r=rand()*tot;for(i=0;i<pool.length;i++){r-=pool[i][1];if(r<=0)return pool[i][0];}
 return pool[0][0];
}

 learn:{t:'「願學。」少年王重複了一遍，像在品這個詞。「這宮裡願學的人不多，多的是願順著說話的人。」他丟給你一卷舊簡：「帶回去讀。」',o:[['接過，叩首謝恩','end','你抱著那卷《商君書》走出殿外，只覺得沉甸甸的。',rf('yingzheng',{tr:6,af:3,re:4},{zhi:1},fl('yz_met'))]]},
 fail:{t:'「連字都不熟，也敢站在寡人面前。」他的聲音不高，卻帶著一點倦意，「回去多讀幾年。」',o:[['愧然退下','end','你退出殿外，臉上發燙。',rf('yingzheng',{tr:-1,re:1},{zhi:1})]]},
 cold:{t:'少年王重新低下頭刻簡，你被晾在殿中，不知該進該退。',o:[['行禮告退','end','你悄悄退出。',rf('yingzheng',{af:-1})]]},
 end:{t:'殿外的日光有些刺眼。你想，這個孩子，將來不會是尋常人。',o:[]}}});
DT('yz_dream',{npc:'yingzheng',ti:'夜半噩夢',after:'yz_first',rep:200,bg:'chamber',c:function(){return R('yingzheng').tr>=15;},n:{
 start:{t:'夜深了，寢殿的燈未熄。少年王坐在榻沿，額上全是冷汗。他看見你，沒有叫人，只低聲道：「寡人夢見邯鄲了。」',o:[
  ['輕聲問：「大王夢見了什麼？」','ask','',null],
  ['默默遞上一盞溫水','water','',null],
  ['答：「夢是夢，大王醒著就好。」','soft','',null,{chk:['mei',42],ng:'ask',nr:'你的話說得太淺，他只是看了你一眼。'}]]},
 ask:{t:'「六歲那年，趙人要殺寡人與母親。」他的聲音平得像在讀簡，「母親把寡人藏在外祖家的箱子裡。那箱子很黑，很悶，我數著自己的呼吸。」他頓了頓，「從那以後，寡人不信箱子外面的人。」',o:[
  ['答：「臣不是箱子外的人，臣只是個守夜的。」','end','他怔了怔，嘴角輕輕動了一下：「守夜……好。」',rf('yingzheng',{tr:10,af:6,re:5,ly:3},{mei:1},fl('yz_trust'))],
  ['答：「那些趙人，總有一天要還的。」','end','他的眼神忽然亮得可怕：「你說得對。總有一天。」',rf('yingzheng',{tr:6,re:6,su:3},{zhi:1})]]},
 water:{t:'他接過水，一口喝盡。「不問，也好。」他把杯子還給你，忽然說：「你會說出去嗎？」',o:[
  ['答：「臣今夜什麼都沒聽見。」','end','他點了點頭：「寡人記著你這句話。」',rf('yingzheng',{tr:9,re:6,af:4},{stealth:1},fl('yz_trust'))],
  ['答：「若大王不願，臣自割其舌。」','end','他吃了一驚，隨即淡淡道：「不必。寡人只要你記住，今夜寡人信了你一次。」',rf('yingzheng',{tr:8,fe:4,ly:5})]]},
 soft:{t:'他勉強笑了笑：「你比那些太傅會說話。」',o:[['行禮：「臣不敢。」','end','他躺下，翻過身去。你守在簾外直到天亮。',rf('yingzheng',{tr:6,af:5},{mei:1})]]},
 end:{t:'天快亮了。你守在殿外，聽見少年王的呼吸終於平穩。',o:[]}}});
DT('yz_law',{npc:'yingzheng',ti:'論法與禮',after:'yz_first',rep:240,bg:'study',c:function(){return R('yingzheng').tr>=25&&S.p.st.zhi>=40;},n:{
 start:{t:'少年王把兩卷簡並排放在案上，一卷是《禮》，一卷是《商君書》。「寡人問你，」他說，「若法與禮相違，從何者？」',o:[
  ['答：「從法。法行則國強。」','law','',null],
  ['答：「禮為法之本，不可偏廢。」','rite','',null,{chk:['zhi',46],ng:'weak',nr:'你想說得圓融些，卻說得不夠有力。'}],
  ['答：「看是誰的法，誰的禮。」','tri','',null,{chk:['zhi',55],ng:'weak',nr:'你想說得深刻，卻有些流於油滑。'}]]},
 law:{t:'「法行則國強。」他點頭，隨即問：「那若有人犯法，是寡人的至親呢？」',o:[
  ['答：「亦當依法。商君曾刑太子之師。」','end','他的眼睛亮了：「商君……是啊，商君。」他低聲說：「你很合寡人的意。」',rf('yingzheng',{tr:8,re:8,af:3},{zhi:1,zheng:1},fl('yz_law'))],
  ['答：「可權衡輕重，大王自有聖斷。」','end','他沉默片刻：「這話像呂相邦說的。」你察覺到他語氣裡的冷。',rf('yingzheng',{su:5,tr:2})]]},
 rite:{t:'他淡淡道：「禮，是給願意守禮的人看的。」他抬眼：「你覺得，趙人守過禮嗎？」',o:[['低頭不語','end','他沒有再問，你卻知道這一題你並未過關。',rf('yingzheng',{tr:-1,re:2})]]},
 tri:{t:'少年王緩緩笑了：「看是誰的……你這話，說到根上去了。」',o:[['答：「誰握權，誰的話便是法與禮。」','end','他看你很久：「這話，不要對外人說。」他的眼神複雜，既有欣賞，又有忌憚。',rf('yingzheng',{tr:6,re:9,su:6,fe:3},{zhi:2})]]},
 weak:{t:'少年王不置可否：「去吧，多讀點書。」',o:[['行禮告退','end','你走出殿外，心裡有些發虛。',rf('yingzheng',{re:1},{zhi:1})]]},
 end:{t:'你離開時，聽見他又拿起刀筆。刻簡的聲音，一下一下。',o:[]}}});
/* ---------- 呂不韋 ---------- */
DT('lbw_goods',{npc:'lbw',ti:'奇貨可居',bg:'study',n:{
 start:{t:'相邦府的書齋裡，竹簡高可及梁。呂不韋捋鬚而笑：「聽說你有些見識。我年輕時是做買賣的，你知道我做過最大的一筆買賣是什麼嗎？」',o:[
  ['答：「莫非是'+'扶立秦王一事？」','king','',null,{chk:['zhi',42],ng:'coy',nr:'你猜得太直白，相邦只笑笑：「小子別亂猜。」'}],
  ['答：「晚輩不知，願聞其詳。」','coy','',null],
  ['答：「相邦的買賣，怕是天下沒有第二筆。」','flat','',null]]},
 king:{t:'呂不韋笑意不減，眼底卻深了一層：「嘘——這話，只能在這間屋子裡說。」他親手為你斟酒：「你是個聰明人。」',o:[
  ['答：「晚輩只是看了一圈，不敢多言。」','end','呂不韋滿意地點頭：「聰明人，不多話。」',rf('lbw',{tr:8,re:6,su:-2},{zhi:1},fl('lbw_secret'))],
  ['答：「相邦，這筆買賣……還在做嗎？」','end','呂不韋的手停了一瞬，隨即笑出了聲：「你好大的膽子！好，我喜歡。」',rf('lbw',{tr:5,re:8,su:6,af:3},{rep:1},fl('lbw_secret'))]]},
 coy:{t:'「那我就講講。」呂不韋啜了口酒，「在邯鄲，我見了一個落魄的秦國質子。我說：此奇貨可居。」他笑笑：「有些人看到的是人，我看到的，是十倍百倍的利。」',o:[
  ['答：「那是相邦的眼光。」','end','「眼光？不，是膽子。」他意味深長地看你，「膽子大的人，才配吃肉。」',rf('lbw',{tr:5,af:3,re:4})],
  ['答：「但人不是貨。」','end','呂不韋的笑容淡了一點：「人，在這世上，哪一個不是貨？」你感到一絲寒意。',rf('lbw',{su:4,re:5},{zhi:1})]]},
 flat:{t:'呂不韋哈哈大笑：「馬屁拍得不錯。」他擺了擺手，「去吧，下次帶點真貨色來。」',o:[['拱手告退','end','你退出書齋，覺得自己被看穿了。',rf('lbw',{af:1})]]},
 end:{t:'你走出相邦府時，天色微暗。你忽然想，這間書齋裡的竹簡，有多少是書，有多少是賬？',o:[]}}});
DT('lbw_book',{npc:'lbw',ti:'一字千金',after:'lbw_goods',rep:300,bg:'study',n:{
 start:{t:'咸陽城門前，懸著一幅長簡，旁邊立著牌子：「有能增損一字者，賞千金。」呂不韋的門客們正圍著它議論。相邦向你招手：「你來看看，這部《呂氏春秋》，可有可改之處？」',o:[
  ['認真讀完，指出一處矛盾','fix','',null,{chk:['zhi',50],ng:'safe',nr:'你找來找去，找不出實質的毛病。'}],
  ['誇讚：「天地萬物，古今之事，全在其中。」','praise','',null],
  ['半開玩笑：「若改一字就賞千金，相邦不虧嗎？」','joke','',null]]},
 fix:{t:'你指出：「十二紀中，貴因與用民所論相悖。」周圍門客倒吸一口氣。呂不韋愣了一下，哈哈大笑：「好！來人，賞千金——不，賞五百金。千金是給我自己看的。」',o:[['謙遜道謝','end','你當眾得了賞，名聲在呂氏門客中傳開。',rf('lbw',{tr:10,re:10,af:5},{zhi:2,gold:200,rep:3},fl('lbw_book'))]]},
 praise:{t:'呂不韋滿意地點頭：「說得好。這部書，是我留給秦國的東西。」他壓低聲音：「也是給那孩子的。」',o:[['答：「大王必能領會相邦苦心。」','end','他沒有答話，只輕輕嘆了口氣：「但願。」',rf('lbw',{tr:5,af:3,re:3})]]},
 joke:{t:'呂不韋愣了片刻，大笑：「你這小子！那你說，我是怕虧，還是怕沒人敢改？」',o:[['答：「怕沒人敢改。」','end','他的笑聲停了，眼神複雜地看了你一眼：「你看得太透。」',rf('lbw',{tr:3,su:5,re:6},{zhi:1})]]},
 safe:{t:'你誠實地說讀不出毛病。呂不韋點點頭：「也好，這書，本來就沒打算讓人挑出毛病來。」',o:[['行禮退下','end','你覺得自己錯過了一次機會。',rf('lbw',{tr:1})]]},
 end:{t:'城門前的長簡在風中輕輕晃動。從沒有人真的拿到那千金。',o:[]}}});
DT('lbw_offer',{npc:'lbw',ti:'相邦的差事',after:'lbw_goods',rep:400,bg:'study',c:function(){return R('lbw').tr>=30;},n:{
 start:{t:'呂不韋屏退左右，低聲道：「有件事，要一個信得過、又不是我府裡的人去辦。事成之後，有你的好處。」',o:[
  ['答：「請相邦明示。」','ask','',null],
  ['答：「晚輩不願捲入府中之事。」','no','',null]]},
 ask:{t:'「太后宮中近來多了個人，名叫嫪毐。」他的手指在案上輕敲，「我要你替我看著他：他見了誰、說了什麼。不必做別的。」',o:[
  ['應下，暗中監視嫪毐','yes','',null],
  ['討價還價：「看一個人，要冒的險可不小。」','bargain','',null,{chk:['mei',40],ng:'yes',nr:'他笑笑，沒有加價，但事你還是得做。'}]]},
 yes:{t:'呂不韋滿意地點頭：「做得乾淨。」',o:[['拱手告辭','end','你領了差事，手心全是汗。',rf('lbw',{tr:8,ly:5,re:4},{gold:60},fl('lbw_spy_laoai'))]]},
 bargain:{t:'呂不韋笑出聲：「有膽氣。好，一倍。」',o:[['答：「成交。」','end','你領了一袋金，也領了一份危險。',rf('lbw',{tr:6,re:7},{gold:140},fl('lbw_spy_laoai'))]]},
 no:{t:'呂不韋臉上的笑意慢慢收斂：「不願意，也好。」他的聲音很平，「但你要記得，今日你聽到的，我不想在別的地方聽見。」',o:[['答：「晚輩明白。」','end','你退出書齋，後背發涼。',rf('lbw',{tr:-3,su:8,fe:6})]]},
 end:{t:'夜風吹過相邦府的長廊。你知道，從今天起，有些事沒有回頭路了。',o:[]}}});
/* ---------- 趙姬／嫪毐／太后 ---------- */
DT('zj_lonely',{npc:'zhaoji',ti:'深宮寂寞',bg:'chamber',n:{
 start:{t:'太后的寢殿裡燃著暖香。趙姬斜倚榻上，目光懶懶地落在你身上：「這宮裡的人，個個都低著頭，說話像在背書。你說，哀家該信誰？」',o:[
  ['答：「信自己所見，不信人所說。」','self','',null],
  ['答：「太后身邊自有忠心之人。」','loyal','',null],
  ['答：「臣不敢妄言。」','safe','',null]]},
 self:{t:'她笑了，眼角的細紋裡有種說不出的疲憊：「所見……哀家見過太多了。邯鄲的豪宅、呂府的燈火、秦宮的高牆。」她凝視你：「你知道，一個女人想在這種地方活著，最需要什麼嗎？」',o:[
  ['答：「需要一個不背叛她的人。」','end','她沉默了。「是啊，一個人。」她輕輕說，「哀家的兒子，已經不需要哀家了。」',rf('zhaoji',{tr:8,af:6,re:3},{mei:1},fl('zj_close'))],
  ['答：「需要一個不怕她的人。」','end','她一怔，隨即低笑：「膽子不小。哀家身邊，倒缺這樣的人。」',rf('zhaoji',{tr:5,af:5,su:3},{rep:1})]]},
 loyal:{t:'她的笑容淡了：「忠心……哀家這輩子，聽過太多忠心。」她不再看你，「退下吧。」',o:[['行禮退下','end','你覺得自己說了句無關痛癢的話。',rf('zhaoji',{tr:1})]]},
 safe:{t:'她輕輕哼了一聲：「不敢。這宮裡最多的就是不敢。」她揮了揮手：「去吧。」',o:[['行禮告退','end','你退出殿外，只覺得那盞暖香熏得人頭暈。',rf('zhaoji',{af:1})]]},
 end:{t:'殿外的風很涼。你想，太后並不如傳言中那般只知享樂，她很孤獨。',o:[]}}});
DT('la_show',{npc:'laoai',ti:'嫪毐顯威',bg:'garden',c:function(){return yrGE(-241);},n:{
 start:{t:'苑囿中擺開宴席。嫪毐一身華服，酒意正酣，當眾以桐木輪穿過自己……引得眾人哄笑。他一把拉過你：「來，陪本侯喝一杯！」',o:[
  ['笑著敬酒，捧他的場','toast','',null],
  ['婉拒：「臣酒量淺。」','no','',null,{chk:['mei',40],ng:'toast',nr:'他眼睛一瞪，你只好硬著頭皮喝了。'}],
  ['藉機打探他與太后的關係','probe','',null,{chk:['stealth',45],ng:'toast',nr:'你的打探被他一眼看穿，只能裝作隨口閒聊。'}]]},
 toast:{t:'嫪毐大笑，摟著你的肩膀：「痛快！我就喜歡爽快人！你記著，在這咸陽城，跟著我不吃虧。」',o:[
  ['答：「侯爺抬愛。」','end','你記住了他身上那股令人不安的氣息：狂。',rf('laoai',{tr:5,af:4,re:-2},{gold:40},fl('la_friend'))]]},
 no:{t:'嫪毐臉色一沉，隨即又換上笑臉：「也罷，不勉強。不過你可別以為，不給本侯面子，沒人記得。」',o:[['答：「不敢。」','end','你感覺到一道冰冷的目光盯在背上。',rf('laoai',{su:6,ha:3,tr:-2},null,null)]]},
 probe:{t:'你「不經意」問起太后近況。嫪毐眯起眼：「太后？太后身子好得很。」他舉杯晃了晃：「你問這做什麼？」',o:[
  ['笑道：「只是關心。」','end','他盯著你，最後哈哈一笑：「懂事的人，會活得久。」',rf('laoai',{su:8,tr:2},{stealth:1},fl('la_probe'))],
  ['低聲：「聽說相邦對侯爺頗為不滿。」','end','嫪毐的酒杯停在半空，笑容消失：「呂不韋？他算什麼。」眼底閃過一絲殺意。',rf('laoai',{tr:4,su:4},{zhi:1},fl('la_probe'))]]},
 end:{t:'宴席散後，月光下嫪毐的身影搖搖晃晃。他像一艘沒有舵的船，駛得飛快。',o:[]}}});
DT('hy_chu',{npc:'huayang',ti:'華陽太后',bg:'chamber',n:{
 start:{t:'華陽太后坐在帷後，衣著素雅，楚地口音柔而不失威。她看了你許久：「聽說，你不是秦人？」',o:[
  ['答：「臣不是，但願為秦盡力。」','serve','',null],
  ['答：「臣從楚地而來。」','chu','',null,{if:'exile_chu'}],
  ['答：「臣出身微賤，不敢論籍貫。」','humble','',null]]},
 serve:{t:'「願為秦盡力……」她輕笑，「說得好聽。這宮裡願為秦盡力的人，十個有九個是為了自己。」她看著你，「你是哪一個？」',o:[['答：「臣是最後那一個，也為自己。」','end','她愣了愣，隨即輕輕點頭：「老實。」',rf('huayang',{tr:6,af:4},{zhi:1})]]},
 chu:{t:'她的目光柔和下來：「楚地……哀家許多年沒回去了。那邊的橘子，還是那麼甜嗎？」',o:[['答：「甜，只是少了春天的味道。」','end','她眼眶微紅：「是啊，少了春天的味道。」她賜了你一些金帛。',rf('huayang',{tr:10,af:8,re:4},{gold:80},fl('hy_chu'))]]},
 humble:{t:'「微賤？」她淡淡道，「這宮裡的人，有幾個不是從微賤裡爬出來的。」',o:[['低頭：「臣受教。」','end','她點了點頭：「去吧。」',rf('huayang',{tr:3,af:2})]]},
 end:{t:'華陽太后的帷簾輕輕晃動。你想，她比所有人以為的，都更早看懂了這宮裡的局。',o:[]}}});
/* ---------- 重臣 ---------- */
DT('ls_mouse',{npc:'lisi',ti:'廁中鼠與倉中鼠',bg:'study',n:{
 start:{t:'李斯在整理簡牘，抬頭看你：「我年輕時在上蔡當小吏，見廁中之鼠食不潔、見人犬而驚；入倉中之鼠食積粟，居大廡之下，不見人犬之憂。人之賢不肖，譬如鼠矣，在所自處耳。」他笑，「你覺得，你現在在哪個位置？」',o:[
  ['答：「仍在廁中。」','toilet','',null],
  ['答：「在倉邊，尚未入倉。」','door','',null],
  ['答：「鼠固貪倉，然倉也有主。」','owner','',null,{chk:['zhi',48],ng:'toilet',nr:'你想說得深些，卻只說出了一句空話。'}]]},

DT('wl_war',{npc:'weiliao',ti:'尉繚論兵',bg:'study',c:function(){return alive('weiliao')&&yrGE(-237);},n:{

DT('wj_army',{npc:'wangjian',ti:'王翦營中',bg:'gate',n:{

DT('zg_canal',{npc:'zhengguo',ti:'疲秦之計',bg:'water',n:{

  ['答：「你不怕被秦王殺嗎？」','fear','',null],

  ['答：「先生願意說，必有信我之意。」','trust','',null]]},

 shy:{t:'韓非苦笑：「讀不懂……沒關係。我的書，本就不是……給所有人讀的。」',o:[['行禮退下','end','你覺得自己錯過了一個機會。',rf('hanfei',{af:1})]]},

DT('zg2_law',{npc:'zhaogao',ti:'趙高習法',bg:'palace',n:{

  ['反問：「大人不是精通刑獄嗎？」','ask','',null]]},

DT('xf_immortal',{npc:'xufu',ti:'東海仙山',bg:'market',n:{

  ['婉拒','end','徐福笑笑：「無妨，心誠則靈。」',rf('xufu',{tr:1})]]},

DT('xw_herb',{npc:'xiawuju',ti:'夏無且採藥',bg:'pharm',n:{

DT('mq_creed',{npc:'moqi',ti:'墨者之義',bg:'market',n:{

 if(!a||a.k==='start'||!g||g.t!=='dice'){
  g=x.mg={t:'dice',r:0,net:0,bet:0,caught:0};

 }
 if(a.k==='bet'){
  if(S.p.st.gold<a.b)return resultScene('骰子賭局','你的錢不夠下這個注。','',S.p.spot);
  g.bet=a.b;g.r=0;g.net=0;g.caught=0;
 }
 if(a.k==='bet'||a.k==='next'){
  if(g.r>=3||S.p.st.gold<g.bet){return NODES.mg_dice({k:'end'});}
  g.r++;
  return scene('【骰子賭局·第 '+g.r+' 局】\n注：'+g.bet+' 金　　累計：'+(g.net>=0?'+':'')+g.net+' 金\n莊家按住骰盅，目光斜斜掃過你：「押大還是押小？」',
   '',{bg:S.p.spot,kind:'menu',ch:[ch('押大','mg_dice',{k:'roll',g:'big'}),ch('押小','mg_dice',{k:'roll',g:'small'}),ch('押豹子（賠五倍）','mg_dice',{k:'roll',g:'triple'}),ch('出千〔隱 '+(30+Math.round(pStat('stealth')*0.4))+'%〕','mg_dice',{k:'roll',g:'cheat'}),ch('收手','mg_dice',{k:'end'})]});
 }
 if(a.k==='roll'){
  var d=[rnd(6),rnd(6),rnd(6)];var sum=d[0]+d[1]+d[2]+3;var tri=(d[0]===d[1]&&d[1]===d[2]);
  var face=DICE_F[d[0]]+' '+DICE_F[d[1]]+' '+DICE_F[d[2]]+'（'+sum+'點'+(tri?'·豹子':sum>=11?'·大':'·小')+'）';
  var t='骰盅揭開：'+face+'\n';var dl=0;
  if(a.g==='cheat'){
   if(rollD(30+pStat('stealth')*0.4)){dl=g.bet;t+='你指尖輕輕一彈，骰子順勢翻面。無人察覺，你贏了。';}
   else{dl=-g.bet*2;g.caught=1;t+='你的手腳被莊家身邊的打手按住，周圍一片寂靜……他們拖你到後巷，狠狠教訓了一頓。';applyFx({st:{hp:-10,rep:-2},bounty:2});}
  }else if(a.g==='triple'){if(tri){dl=g.bet*5;t+='豹子！全場嘩然，莊家臉色鐵青。';}else{dl=-g.bet;t+='沒有開出豹子，你輸了。';}}
  else{
   if(tri){dl=-g.bet;t+='豹子通殺，所有人的注都歸莊家。';}
   else if((a.g==='big')===(sum>=11)){dl=g.bet;t+='你猜中了！莊家無奈地推過來銅錢。';}
   else{dl=-g.bet;t+='猜錯了，莊家笑嘻嘻地把你的注收走。';}
  }
  g.net+=dl;S.p.st.gold=Math.max(0,S.p.st.gold+dl);
  var c2=[];
  if(g.caught||g.r>=3||S.p.st.gold<g.bet){c2.push(ch('結算','mg_dice',{k:'end'}));}
  else{c2.push(ch('再來一局','mg_dice',{k:'next'}));c2.push(ch('收手','mg_dice',{k:'end'}));}
  return scene('【骰子賭局·第 '+g.r+' 局】\n'+t+'\n\n本局 '+(dl>=0?'+':'')+dl+' 金　累計 '+(g.net>=0?'+':'')+g.net+' 金',
   '',{bg:S.p.spot,kind:'result',ch:c2});
 }
 if(a.k==='end'){

NODES.mg_duel=function(a){
 var x=X();var g=x.mg;
 if(!a||a.k==='start'||!g||g.t!=='duel'){
  var c=[];
  c.push(ch('切磋（點到為止）','mg_duel',{k:'go',lv:0}));
  c.push(ch('正式比武（賭注 30 金）','mg_duel',{k:'go',lv:1}));

  return scene('【擂台比武】\n演武場上人頭攢動，旗幟獵獵。一位漢子抱拳：「有人想上來賜教嗎？」\n規則：每回合選「攻」「守」「奇」。攻克奇、奇克守、守克攻。三戰兩勝。','',{bg:S.p.spot,kind:'menu',ch:c});
 }
 if(a.k==='go'){
  var pool=DUEL_FOES.slice(0,a.lv===0?3:a.lv===1?4:5);if(a.lv===2)pool=DUEL_FOES.slice(2);
  var f=pick(pool);
  g=x.mg={t:'duel',foe:f,lv:a.lv,r:0,pw:0,ow:0,log:''};
  if(a.lv>=1){if(S.p.st.gold<30){x.mg=null;return resultScene('擂台比武','你的錢不夠下注。','',S.p.spot);}}
  return NODES.mg_duel({k:'round'});
 }
 if(a.k==='round'){
  g.r++;
  return scene('【擂台比武·第 '+g.r+' 回合】\n對手：'+g.foe.n+'（'+g.foe.st+'）\n你觀察到：'+g.foe.hint+'\n戰績　你 '+g.pw+' : '+g.ow+' 對手\n'+(g.log?'\n上回：'+g.log:''),
   '',{bg:S.p.spot,kind:'menu',ch:[ch('攻（克奇）','mg_duel',{k:'mv',m:0}),ch('守（克攻）','mg_duel',{k:'mv',m:1}),ch('奇（克守）','mg_duel',{k:'mv',m:2}),ch('認輸','mg_duel',{k:'end',res:'give'})]});
 }
 if(a.k==='mv'){
  var f2=g.foe;var wt=f2.w;var tot=wt[0]+wt[1]+wt[2];var rr=rnd(tot);var om=0;
  if(rr>=wt[0]){rr-=wt[0];om=1;if(rr>=wt[1])om=2;}
  var pm=a.m;var res;
  var beats=[2,0,1]; /* 攻克奇(2)、守克攻(0)、奇克守(1) */
  var base=50+(pStat('wu')-f2.wu)*0.55;
  if(pm===om)res=0;else if(beats[pm]===om)res=1;else res=-1;
  var p=res===1?base+26:res===-1?base-26:base;
  if(res===0&&rollD(p))res=1;
  else if(res===0)res=-1;
  else{res=rollD(p)?1:-1;}
  g.log='你出「'+DUEL_N[pm]+'」，對手出「'+DUEL_N[om]+'」，'+(res>0?'你佔了上風。':'對手搶得先機。');
  if(res>0)g.pw++;else g.ow++;

  return scene('【擂台比武·第 '+g.r+' 回合結果】\n'+g.log+'\n\n戰績　你 '+g.pw+' : '+g.ow+' 對手','',{bg:S.p.spot,kind:'result',ch:[ch('下一回合','mg_duel',{k:'round'})]});
 }
 if(a.k==='end'){
  var lv=g.lv,f3=g.foe;var win=a.res==='win';x.mg=null;mgMark('duel');
  var fx={days:1,st:{}};var t='';
  if(a.res==='give'){t='你抱拳認輸，對手還禮：「承讓。」';fx.st={rep:-1};if(lv>=1)fx.st.gold=-30;}
  else if(win){
   t='你贏下了這一場！'+f3.n+'抱拳：「佩服。」圍觀者叫好聲不絕。';
   fx.st={rep:2+lv*2,wu:lv>=1?1:0};if(lv===1)fx.st.gold=60;if(lv===2){fx.st.gold=200;fx.st.wu=2;fx.st.merit=4;}
   if(lv===0)fx.st.mei=1;
  }else{
   t='你落敗了。'+f3.n+'收起架勢，向你拱手。';
   fx.st={hp:-(4+lv*8),rep:lv===2?-2:0};if(lv>=1)fx.st.gold=-30;if(lv===2)fx.st.gold=-100;
   if(lv===0)fx.st.wu=1;
  }
  return mgDone('擂台比武',t,fx,'',S.p.spot,(lv===0?'切磋':lv===1?'正式':'生死擂')+'比武'+(a.res==='give'?'認輸':win?'獲勝':'落敗'));
 }

};

AI.judgeSystem=function(){
 return '你是「浮生天下」的判斷官。'+AI.worldRules()+'你根據人物性格、關係、局勢與難度，判定一個事件的結果，並寫一段繁體中文敘述。\n'
 +'規則：1. 只輸出一個JSON物件，不要Markdown或其他文字。2. 敘述古風簡練、100-200字，含必要對白；親密場面一律含蓄、暗示、淡出，不得描寫性行為或露骨細節；暴力與刑罰以簡潔敘述帶過，不描寫細節。3. 人物反應要符合其性格與已有關係，不要讓人物突然失常；難度愈高，人物愈敏感多疑、懲罰愈嚴厲、成功愈難。4. 數值必須落在指定範圍。5. 只使用提供的id。難度：'+DN()+'。';

AI.judgeRun=function(a){
 var spec=JD.kinds[a.jk];
 var msgs=[{role:'system',content:AI.judgeSystem()},{role:'user',content:AI.judgeUser(a)}];
 var once=function(retry){
  var m=msgs.slice();if(retry)m.push({role:'user',content:'上一次輸出不是合法JSON或欄位不符。請只輸出符合格式的單一JSON物件。'});
  return AI.call(m,{maxTok:Math.min(1200,SET.maxTok||2400)}).then(function(res){
   var j=AI.extractJSON(res.text);var v=null;
   try{v=spec.check(j,a);}catch(e){v=null;}
   if(!v){if(!retry)return once(true);throw {kind:'schema'};}
   return v;
  },function(e){if(e&&e.kind==='http'&&e.status>=500&&!retry)return once(true);throw e;});
 };
 return once(false).then(function(v){
  S.ai.fails=0;
  var args={};for(var k in a.args)args[k]=a.args[k];args.ai=v;
  var sc=NODES[a.node](args);
  if(sc&&typeof sc==='object')sc.ai=1;
  return sc;
 });
};
(function(){

function jnum(v,lo,hi,d){v=+v;if(isNaN(v))return d||0;return clamp(Math.round(v),lo,hi);}

function jenum(v,list,d){return list.indexOf(v)>=0?v:d;}

/* ===== V5：畫面強化（人物描邊與光影、頭像底景、氛圍粒子、轉場）===== */
(function(){
 var TC=null,OC=null;
 function bufs(w,h){
  if(!TC){TC=document.createElement('canvas');OC=document.createElement('canvas');}
  if(TC.width!==w||TC.height!==h){TC.width=w;TC.height=h;OC.width=w;OC.height=h;}
 }
 var _chibi=Side.chibi;
 /* 場景人物：柔影、描邊、體積明暗、時辰色調、附近光源暖光、腰帶飄動、待機呼吸 */
 Side.chibi=function(g,cx,fy,look,sex,o){
  o=o||{};var u=o.u||1;
  try{
   if(!o.noshadow){
    g.fillStyle='rgba(0,0,0,0.17)';g.fillRect(Math.round(cx-6*u),Math.round(fy-2*u),12*u,u);
    g.fillStyle='rgba(0,0,0,0.24)';g.fillRect(Math.round(cx-8*u),Math.round(fy-u),16*u,u);
    g.fillRect(Math.round(cx-6*u),Math.round(fy),12*u,Math.max(1,Math.round(u*0.8)));
   }
   var W=Math.ceil(30*u)+8,H=Math.ceil(40*u)+8,ox=Math.round(W/2),oy=H-4;
   bufs(W,H);
   var tg=TC.getContext('2d');tg.setTransform(1,0,0,1,0,0);tg.globalCompositeOperation='source-over';tg.clearRect(0,0,W,H);tg.imageSmoothingEnabled=false;
   var oo={},k;for(k in o)oo[k]=o[k];oo.noshadow=true;
   var fr=o.fr||0,moving=!!o.walk;
   var yy=oy;if(!moving&&((fr+(cx>>2))%16)<3)yy-=Math.max(1,Math.round(u*0.5));
   _chibi(tg,ox,yy,look,sex,oo);
   /* 腰帶飄尾 */
   var dir=o.dir||1,fcol=o.fac||(look&&look.tr)||'#d9a93a';
   var sw=Math.round(Math.sin(fr*0.7+cx)*(moving?1.6:0.6)*u);
   var tx=dir>0?ox-7*u:ox+5*u,sd=dir>0?-sw:sw;
   tg.fillStyle=fcol;tg.fillRect(tx,yy-9*u,2*u,3*u);
   tg.fillRect(tx+sd,yy-6*u,2*u,3*u);tg.fillStyle=shade(fcol,-34);tg.fillRect(tx+sd,yy-4*u,2*u,u);
   /* 明暗：上亮下暗 */
   tg.globalCompositeOperation='source-atop';
   var gr=tg.createLinearGradient(0,oy-34*u,0,oy);gr.addColorStop(0,'rgba(255,238,196,0.16)');gr.addColorStop(0.55,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(12,6,34,0.26)');
   tg.fillStyle=gr;tg.fillRect(0,0,W,H);
   /* 背光側暗邊 */
   tg.fillStyle='rgba(20,10,30,0.16)';tg.fillRect(dir>0?ox+3*u:ox-6*u,oy-26*u,3*u,26*u);
   var P=Side.TP&&Side.TP[Side.tod];
   if(P&&P.tint){tg.fillStyle='rgba('+P.tint+','+(P.ta*(Side.indoor?0.5:1)*0.85)+')';tg.fillRect(0,0,W,H);}
   var Ls=Side.lights||[];
   for(var i=0;i<Ls.length;i++){var l=Ls[i];var dx=cx-l.x,dy=(fy-14*u)-l.y,d=Math.sqrt(dx*dx+dy*dy);var rr=l.r*1.25;
    if(d<rr&&(Side.tod!=='day'||Side.indoor)){var a=(1-d/rr)*l.a*0.32;tg.fillStyle='rgba('+(l.c||'255,190,100')+','+a.toFixed(3)+')';tg.fillRect(0,0,W,H);}}
   tg.globalCompositeOperation='source-over';
   /* 描邊 */
   var og=OC.getContext('2d');og.setTransform(1,0,0,1,0,0);og.globalCompositeOperation='source-over';og.clearRect(0,0,W,H);
   var t=Math.max(1,Math.round(u));
   og.drawImage(TC,t,0);og.drawImage(TC,-t,0);og.drawImage(TC,0,t);og.drawImage(TC,0,-t);
   og.globalCompositeOperation='source-in';og.fillStyle='rgba(24,14,10,0.92)';og.fillRect(0,0,W,H);
   og.globalCompositeOperation='source-over';og.drawImage(TC,0,0);
   g.imageSmoothingEnabled=false;
   g.drawImage(OC,Math.round(cx-ox),Math.round(fy-oy));
  }catch(e){_chibi(g,cx,fy,look,sex,o);}
 };

 /* 頭像：漸層底景、光斑、地面、暗角與高光 */
 Art.portrait=function(canvas,look,sex,bgc){
  var g=canvas.getContext('2d');g.imageSmoothingEnabled=false;canvas.width=40;canvas.height=40;
  var c=bgc||'#4a5a7a',y,x;
  var top=mix(c,'#ffffff',0.22),bot=shade(c,-52);
  for(y=0;y<40;y++){g.fillStyle=mix(top,bot,y/39);g.fillRect(0,y,40,1);}
  var h=hashStr(c+(look&&look.h||'')),r=mkRng(h);
  g.fillStyle='rgba(255,255,255,0.10)';
  for(x=0;x<7;x++){g.fillRect(Math.floor(r()*38),Math.floor(r()*24),2,2);}
  g.fillStyle='rgba(255,255,255,0.05)';g.fillRect(0,0,40,3);
  g.fillStyle=shade(c,-64);g.fillRect(0,35,40,5);g.fillStyle=shade(c,-30);g.fillRect(0,35,40,1);
  var B=portraitBuf(look,sex);
  for(y=0;y<40;y++)for(x=0;x<40;x++){var col=B[y][x];if(col){
   if(x>=25&&y>=26&&((x+y)&1)===0)col=shade(col,-14);
   else if(x<=15&&y>=28&&x>=9&&((x+y)&1)===0)col=shade(col,10);
   g.fillStyle=col;g.fillRect(x,y,1,1);}}
  var vg=g.createRadialGradient(20,18,10,20,20,30);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(8,4,2,0.40)');
  g.fillStyle=vg;g.fillRect(0,0,40,40);
  var hl=g.createLinearGradient(0,0,40,40);hl.addColorStop(0,'rgba(255,240,200,0.20)');hl.addColorStop(0.35,'rgba(255,240,200,0)');
  g.fillStyle=hl;g.fillRect(0,0,40,40);
 };

  L.push('【仕途】'+p.title+'（第'+(p.rank+1)+'階／共5階）　所屬：'+FACTIONS[p.fac].n);
  L.push('職司：'+ps.duty+'　俸祿 +'+ps.sal+'金/月'+(ps.troop?'　部曲 +'+ps.troop+'/月':'')+'\n任職 '+Math.max(0,S.day-c.lp)+' 日　考績 '+c.pf+'（'+(c.pf>=60?'優':c.pf>=30?'平':'劣')+'）　怠職警告 '+c.wn+'/3');
  var hs=C.honors();if(hs.length)L.push('榮銜：'+hs.join('、'));
  if(p.rank>=4){L.push('\n你已登此路之巔：'+pa.ranks[4]+'。往後的路，在於守住它——或把它變成更大的籌碼。');return L.join('\n');}
  var rq=C.reqs('std');var nx=pa.ranks[rq.r];
  L.push('\n━ 下一階：'+nx+'（'+C.post(rq.r).duty+'）━');
  var miss=[];
  for(var i=0;i<rq.items.length;i++){var x=rq.items[i];
   var cmp=x.max?(x.lt?x.have+'／<'+x.need:x.have+'／≤'+x.need):(x.have+'/'+x.need);
   L.push((x.ok?'✔ ':'✘ ')+x.t+'　'+cmp+(x.k==='merit'?'　'+bar(x.have,x.need):''));
   if(!x.ok)miss.push(x);}
  if(miss.length){L.push('\n▶ 還差：');for(i=0;i<miss.length&&i<4;i++){var m=miss[i];var gap=m.max?'':('還差 '+Math.max(0,m.need-m.have)+'：');L.push('　· '+m.t+'——'+gap+m.tip);}}
  else L.push('\n✔ 條件已齊備，可以申請晉升！');
  var v=C.rival();
  if(v)L.push('\n同階競爭：'+v.n+'（'+rivalWord(v,rq)+'）　你的勝算約 '+C.win(rq)+'%'+(c.pity?'（歷練加成+'+c.pity+'）':''));
  var ex=[];
  var lt=C.letters();if(lt.length)ex.push('舉薦信 '+lt.length+' 封（功勳只需'+Math.round(letterFactor(lt[0])*100)+'%，免資歷與上司賞識）');
  if(c.big>0)ex.push('大功 '+c.big+' 次（需 '+rq.r+' 次可「大功特擢」，功勳只需80%，免資歷與聲望）');
  ex.push('捐納賄賂 '+C.bribeCost()+' 金（功勳60%，有風險）');
  L.push('\n其他途徑：'+ex.join('；')+'。');
  return L.join('\n');
 };
